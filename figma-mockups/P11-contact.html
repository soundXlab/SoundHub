<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — Contact</title><link rel="stylesheet" href="design-system/shared.css"><style>nav.pricing-nav{display:flex;align-items:center;gap:24px;padding:16px 40px;border-bottom:1px solid var(--border-default);width:100%}.contact-layout{display:grid;grid-template-columns:1fr 1fr;gap:48px;max-width:1000px;margin:0 auto;padding:60px 40px}.contact-form{display:flex;flex-direction:column;gap:16px}.contact-info h1{font-size:28px;font-weight:800;margin-bottom:12px}.contact-info p{font-size:14px;color:var(--text-secondary);line-height:1.6;margin-bottom:24px}.contact-method{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-default)}.contact-method .icon{font-size:20px;width:32px;text-align:center}.contact-method .label{font-size:13px;font-weight:600}.contact-method .value{font-size:12px;color:var(--text-secondary)}</style></head><body><nav class="pricing-nav"><span style="font-size:18px;font-weight:800;color:var(--brand-accent)">🎵 SoundHub</span><span style="flex:1"></span><a href="#" style="font-size:13px;color:var(--text-secondary);text-decoration:none">Features</a><a href="#" style="font-size:13px;color:var(--text-secondary);text-decoration:none">Docs</a><a href="#" style="font-size:13px;color:var(--text-secondary);text-decoration:none">Pricing</a><a href="#" style="font-size:13px;color:var(--text-secondary);text-decoration:none">Sign in</a><button class="btn btn-primary btn-sm">Get Started</button></nav><div class="contact-layout"><div class="contact-info"><h1>Get in touch</h1><p>Have a question, suggestion, or just want to say hi? We'd love to hear from you.</p><div class="contact-method"><span class="icon">📧</span><div><div class="label">Email</div><div class="value">hello@soundhub.io</div></div></div><div class="contact-method"><span class="icon">💬</span><div><div class="label">Discord</div><div class="value">Join our community server</div></div></div><div class="contact-method"><span class="icon">🐦</span><div><div class="label">Twitter</div><div class="value">@soundhub_io</div></div></div><div class="contact-method"><span class="icon">📖</span><div><div class="label">Documentation</div><div class="value">docs.soundhub.io</div></div></div></div><form class="contact-form"><div class="form-group"><label class="form-label">Name</label><input class="form-input" placeholder="Your name"></div><div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" placeholder="you@example.com"></div><div class="form-group"><label class="form-label">Subject</label><select class="form-select" style="width:100%"><option>General inquiry</option><option>Technical support</option><option>Bug report</option><option>Feature request</option><option>Partnership</option></select></div><div class="form-group"><label class="form-label">Message</label><textarea class="form-input" style="height:120px;padding:10px 12px;resize:vertical;font-family:var(--font-sans)" placeholder="Tell us what's on your mind..."></textarea></div><button class="btn btn-primary btn-lg" style="align-self:flex-start">Send message</button></form></div></body></html>
