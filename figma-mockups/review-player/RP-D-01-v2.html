<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>SoundHub — RP/D/01 v2</title>
  <link rel="stylesheet" href="rp.css">
  <style>
    .gate { display:flex; align-items:center; justify-content:center; min-height:calc(100vh - 56px); }
    .gate-card {
      background: var(--surface-2); border:1px solid var(--border); border-radius:12px;
      padding:48px 40px; max-width:420px; width:100%; text-align:center;
    }
    .gate-card .gate-icon { font-size:48px; margin-bottom:16px; opacity:.6; }
    .gate-card h1 { font:600 22px/1.3 var(--font); color:var(--text-1); margin:0 0 8px; }
    .gate-card .gate-sub { font:14px/1.5 var(--font); color:var(--text-3); margin:0 0 28px; }
    .gate-card .field {
      width:100%; padding:12px 16px; background:var(--surface-1); border:1px solid var(--border);
      border-radius:8px; color:var(--text-1); font:14px var(--font); box-sizing:border-box;
      outline:none; transition:border-color .15s;
    }
    .gate-card .field:focus { border-color:var(--accent); }
    .gate-card .field::placeholder { color:var(--text-4); }
    .gate-card .btn { margin-top:16px; }
    .gate-card .gate-hint { font:12px var(--font); color:var(--text-4); margin-top:16px; }
    .gate-card .gate-hint a { color:var(--accent); text-decoration:none; }
    .gate-card .gate-hint a:hover { text-decoration:underline; }
  </style>
</head>
<body class="studio">
<div class="frame-meta"><span class="fid">RP/D/01</span><span class="req doc">DOC</span><span class="req draft">DRAFT COPY</span><span class="frame-name">Password gate</span></div>
<div class="artboard desktop"><div class="rp">
    <header class="rp-header"><span class="wordmark">Sound<span>Hub</span></span></header>
    <div class="gate">
      <div class="gate-card">
        <div class="gate-icon">🔒</div>
        <h1>This link is password protected</h1>
        <p class="gate-sub">Эта ссылка защищена паролем. Введите пароль для доступа к обзору.</p>
        <form action="RP-D-02.html">
          <input class="field" type="password" required placeholder="Enter password" />
          <button class="btn accent block" type="submit">Open review</button>
        </form>
        <p class="gate-hint">Don't have the password? <a href="#">Contact the project owner</a></p>
      </div>
    </div>
</div></div>
<script src="rp.js"></script>
</body>
</html>
