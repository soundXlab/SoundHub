<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>SoundHub — RP/D/08 v2</title>
  <link rel="stylesheet" href="rp.css">
  <style>
    .gate { display:flex; align-items:center; justify-content:center; min-height:calc(100vh - 56px); }
    .gate-card {
      background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
      padding:48px 40px; max-width:420px; width:100%; text-align:center;
    }
    .gate-card .gate-icon { font-size:48px; margin-bottom:16px; opacity:.6; }
    .gate-card h1 { font:600 22px/1.3 var(--font); color:var(--text-1); margin:0 0 8px; }
    .gate-card .gate-sub { font:14px/1.5 var(--font); color:var(--text-3); margin:0 0 24px; }
    .gate-card .gate-actions { display:flex; flex-direction:column; gap:8px; }
  </style>
</head>
<body class="studio">
<div class="frame-meta"><span class="fid">RP/D/08</span><span class="req doc">DOC</span><span class="req draft">DRAFT COPY</span><span class="frame-name">Expired link</span></div>
<div class="artboard desktop"><div class="rp">
    <header class="rp-header"><span class="wordmark">Sound<span>Hub</span></span></header>
    <div class="gate">
      <div class="gate-card">
        <div class="gate-icon">⏰</div>
        <h1>This review link has expired</h1>
        <p class="gate-sub">Review links expire after 7 days. Ask your engineer for a new link, or check your email for an updated URL.</p>
        <div class="gate-actions">
          <a class="btn accent block" href="RP-D-05.html" style="text-decoration:none">Open latest review</a>
          <a class="btn ghost block" href="RP-D-01.html" style="text-decoration:none">Try another link</a>
        </div>
      </div>
    </div>
</div></div>
<script src="rp.js"></script>

</html>
