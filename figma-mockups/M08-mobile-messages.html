<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=390"><title>SoundHub — Mobile Messages</title><link rel="stylesheet" href="design-system/shared.css"><style>body{background:var(--bg-primary);display:flex;justify-content:center}.mobile{width:390px;min-height:100vh;background:var(--bg-primary)}.mobile-topbar{height:48px;background:var(--bg-panel);border-bottom:1px solid var(--border-default);display:flex;align-items:center;padding:0 16px;gap:12px;position:sticky;top:0;z-index:10}.mobile-content{padding:12px 16px}.conv-item-m{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border-default)}.conv-avatar-m{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:white;flex-shrink:0}.conv-info-m{flex:1;min-width:0}.conv-name-m{font-size:13px;font-weight:600}.conv-preview-m{font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conv-time-m{font-size:10px;color:var(--text-muted);flex-shrink:0;margin-top:2px}.conv-unread-m{width:8px;height:8px;background:var(--brand-primary);border-radius:50%;flex-shrink:0;margin-top:6px}</style></head><body><div class="mobile"><div class="mobile-topbar"><span style="font-size:14px;font-weight:600">Messages</span><span style="flex:1"></span><span>✏️</span></div><div class="mobile-content"><input class="form-input" placeholder="🔍 Search..." style="width:100%;margin-bottom:12px;height:32px;font-size:12px"><div class="conv-item-m"><div class="conv-avatar-m" style="background:var(--brand-secondary)">S</div><div class="conv-info-m"><div class="conv-name-m">Sarah Chen</div><div class="conv-preview-m">Great work on the mix! Let me know when...</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="conv-time-m">2m</span><div class="conv-unread-m"></div></div></div><div class="conv-item-m"><div class="conv-avatar-m" style="background:var(--color-warning)">A</div><div class="conv-info-m"><div class="conv-name-m">Alex Rivera</div><div class="conv-preview-m">Can you send me the stems for...</div></div><span class="conv-time-m">1h</span></div><div class="conv-item-m"><div class="conv-avatar-m" style="background:var(--brand-primary)">M</div><div class="conv-info-m"><div class="conv-name-m">Maya Johnson</div><div class="conv-preview-m">Thanks for the feedback on my track!</div></div><span class="conv-time-m">3d</span></div><div class="conv-item-m"><div class="conv-avatar-m" style="background:var(--color-info)">L</div><div class="conv-info-m"><div class="conv-name-m">Label Contact</div><div class="conv-preview-m">We'd like to discuss the release...</div></div><span class="conv-time-m">5d</span></div></div></div></body></html>
