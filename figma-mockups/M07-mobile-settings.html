<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=390"><title>SoundHub — Mobile Settings</title><link rel="stylesheet" href="design-system/shared.css"><style>body{background:var(--bg-primary);display:flex;justify-content:center}.mobile{width:390px;min-height:100vh;background:var(--bg-primary)}.mobile-topbar{height:48px;background:var(--bg-panel);border-bottom:1px solid var(--border-default);display:flex;align-items:center;padding:0 16px;gap:12px;position:sticky;top:0;z-index:10}.mobile-content{padding:16px}.settings-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border-default)}.settings-item:last-child{border:none}.settings-item .icon{font-size:18px;width:24px;text-align:center}.settings-item .label{flex:1;font-size:13px;font-weight:500}.settings-item .arrow{color:var(--text-muted);font-size:12px}</style></head><body><div class="mobile"><div class="mobile-topbar"><span style="font-size:14px;font-weight:600">Settings</span></div><div class="mobile-content"><div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:16px;background:var(--bg-surface);border-radius:var(--radius-lg)"><div style="width:48px;height:48px;border-radius:50%;background:var(--brand-gradient);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:white">P</div><div><div style="font-size:14px;font-weight:700">Producer</div><div style="font-size:11px;color:var(--text-muted)">@producer · Pro plan</div></div></div><div style="font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px">Account</div><div class="settings-item"><span class="icon">👤</span><span class="label">Profile</span><span class="arrow">›</span></div><div class="settings-item"><span class="icon">🔒</span><span class="label">Security</span><span class="arrow">›</span></div><div class="settings-item"><span class="icon">💳</span><span class="label">Billing</span><span class="arrow">›</span></div><div style="font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin:16px 0 8px">Preferences</div><div class="settings-item"><span class="icon">🔔</span><span class="label">Notifications</span><span class="arrow">›</span></div><div class="settings-item"><span class="icon">🎨</span><span class="label">Appearance</span><span class="arrow">›</span></div><div class="settings-item"><span class="icon">🔑</span><span class="label">API Keys</span><span class="arrow">›</span></div><div class="settings-item"><span class="icon">💾</span><span class="label">Storage</span><span class="arrow">›</span></div><div style="font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin:16px 0 8px">Support</div><div class="settings-item"><span class="icon">📖</span><span class="label">Documentation</span><span class="arrow">›</span></div><div class="settings-item"><span class="icon">❓</span><span class="label">Help & Support</span><span class="arrow">›</span></div><div class="settings-item"><span class="icon">📋</span><span class="label">Changelog</span><span class="arrow">›</span></div><div style="margin-top:24px"><button class="btn btn-ghost" style="width:100%;justify-content:center;color:var(--color-error)">Sign Out</button></div></div></div></body></html>
