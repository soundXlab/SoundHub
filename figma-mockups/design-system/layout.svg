<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#0A0A0B"/>
  
  <!-- Title -->
  <text x="40" y="50" font-family="Inter, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">Design System — Layout &amp; Spacing</text>
  <text x="40" y="80" font-family="Inter, sans-serif" font-size="14" fill="#71717A">Grid, Spacing Scale, Shadows, Border Radius</text>
  
  <!-- Spacing Scale -->
  <text x="40" y="130" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#52525B" letter-spacing="1">SPACING SCALE</text>
  
  <rect x="40" y="145" width="8" height="8" rx="2" fill="#8B5CF6"/>
  <text x="60" y="153" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">4px — xs</text>
  
  <rect x="160" y="145" width="12" height="12" rx="2" fill="#8B5CF6"/>
  <text x="182" y="155" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">6px — sm</text>
  
  <rect x="280" y="145" width="16" height="16" rx="2" fill="#8B5CF6"/>
  <text x="306" y="157" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">8px — md</text>
  
  <rect x="400" y="145" width="20" height="20" rx="2" fill="#8B5CF6"/>
  <text x="430" y="159" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">10px — lg</text>
  
  <rect x="520" y="145" width="24" height="24" rx="2" fill="#8B5CF6"/>
  <text x="554" y="161" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">12px — xl</text>
  
  <rect x="640" y="145" width="32" height="32" rx="2" fill="#8B5CF6"/>
  <text x="682" y="165" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">16px — 2xl</text>
  
  <rect x="780" y="145" width="40" height="40" rx="2" fill="#8B5CF6"/>
  <text x="830" y="169" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">20px — 3xl</text>
  
  <rect x="920" y="145" width="48" height="48" rx="2" fill="#8B5CF6"/>
  <text x="978" y="173" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">24px — 4xl</text>
  
  <!-- Grid -->
  <text x="40" y="210" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#52525B" letter-spacing="1">12-COLUMN GRID</text>
  
  <rect x="40" y="225" width="1120" height="80" rx="8" fill="#111113"/>
  <g opacity="0.3">
    <rect x="40" y="225" width="86" height="80" fill="#8B5CF6"/>
    <rect x="133" y="225" width="86" height="80" fill="#8B5CF6"/>
    <rect x="226" y="225" width="86" height="80" fill="#8B5CF6"/>
    <rect x="319" y="225" width="86" height="80" fill="#8B5CF6"/>
    <rect x="412" y="225" width="86" height="80" fill="#8B5CF6"/>
    <rect x="505" y="225" width="86" height="80" fill="#8B5CF6"/>
    <rect x="598" y="225" width="86" height="80" fill="#8B5CF6"/>
    <rect x="691" y="225" width="86" height="80" fill="#8B5CF6"/>
    <rect x="784" y="225" width="86" height="80" fill="#8B5CF6"/>
    <rect x="877" y="225" width="86" height="80" fill="#8B5CF6"/>
    <rect x="970" y="225" width="86" height="80" fill="#8B5CF6"/>
    <rect x="1063" y="225" width="86" height="80" fill="#8B5CF6"/>
  </g>
  <text x="600" y="270" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">12 cols · 16px gutter · 24px margin</text>
  
  <!-- Border Radius -->
  <text x="40" y="340" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#52525B" letter-spacing="1">BORDER RADIUS</text>
  
  <rect x="40" y="355" width="60" height="60" rx="0" fill="#111113" stroke="#27272A" stroke-width="1"/>
  <text x="70" y="430" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#71717A">0</text>
  
  <rect x="120" y="355" width="60" height="60" rx="4" fill="#111113" stroke="#27272A" stroke-width="1"/>
  <text x="150" y="430" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#71717A">4px</text>
  
  <rect x="200" y="355" width="60" height="60" rx="8" fill="#111113" stroke="#27272A" stroke-width="1"/>
  <text x="230" y="430" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#71717A">8px</text>
  
  <rect x="280" y="355" width="60" height="60" rx="12" fill="#111113" stroke="#27272A" stroke-width="1"/>
  <text x="310" y="430" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#71717A">12px</text>
  
  <rect x="360" y="355" width="60" height="60" rx="16" fill="#111113" stroke="#27272A" stroke-width="1"/>
  <text x="390" y="430" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#71717A">16px</text>
  
  <rect x="440" y="355" width="60" height="60" rx="24" fill="#111113" stroke="#27272A" stroke-width="1"/>
  <text x="470" y="430" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#71717A">24px</text>
  
  <rect x="520" y="355" width="60" height="60" rx="30" fill="#111113" stroke="#27272A" stroke-width="1"/>
  <text x="550" y="430" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#71717A">32px</text>
  
  <!-- Shadows -->
  <text x="40" y="470" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#52525B" letter-spacing="1">ELEVATION / SHADOWS</text>
  
  <rect x="40" y="485" width="160" height="60" rx="12" fill="#111113" filter="url(#shadow-sm)"/>
  <text x="120" y="520" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#A1A1AA">sm — 0 1px 2px</text>
  
  <rect x="220" y="485" width="160" height="60" rx="12" fill="#111113" filter="url(#shadow-md)"/>
  <text x="300" y="520" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#A1A1AA">md — 0 4px 6px</text>
  
  <rect x="400" y="485" width="160" height="60" rx="12" fill="#111113" filter="url(#shadow-lg)"/>
  <text x="480" y="520" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#A1A1AA">lg — 0 10px 15px</text>
  
  <rect x="580" y="485" width="160" height="60" rx="12" fill="#111113" filter="url(#shadow-xl)"/>
  <text x="660" y="520" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#A1A1AA">xl — 0 20px 25px</text>
  
  <defs>
    <filter id="shadow-sm" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow-md" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="shadow-lg" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="shadow-xl" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Layout Examples -->
  <text x="40" y="580" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#52525B" letter-spacing="1">LAYOUT PATTERNS</text>
  
  <!-- Dashboard Layout -->
  <rect x="40" y="595" width="240" height="160" rx="8" fill="#111113" stroke="#27272A" stroke-width="1"/>
  <rect x="40" y="595" width="240" height="24" rx="8" fill="#18181B"/>
  <text x="160" y="611" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#71717A">TopBar (56px)</text>
  <rect x="40" y="619" width="60" height="136" fill="#18181B"/>
  <text x="70" y="690" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#71717A">Side</text>
  <rect x="100" y="619" width="180" height="136" fill="#0D0D0F"/>
  <text x="190" y="690" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#71717A">Content</text>
  <text x="160" y="770" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#A1A1AA">Dashboard</text>
  
  <!-- Split Layout -->
  <rect x="310" y="595" width="240" height="160" rx="8" fill="#111113" stroke="#27272A" stroke-width="1"/>
  <rect x="310" y="595" width="120" height="160" fill="#18181B"/>
  <text x="370" y="680" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#71717A">Browser</text>
  <rect x="430" y="595" width="120" height="160" fill="#0D0D0F"/>
  <text x="490" y="680" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#71717A">Timeline</text>
  <text x="430" y="770" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#A1A1AA">DAW View</text>
  
  <!-- Centered Layout -->
  <rect x="580" y="595" width="240" height="160" rx="8" fill="#111113" stroke="#27272A" stroke-width="1"/>
  <rect x="620" y="620" width="160" height="120" rx="8" fill="#18181B"/>
  <text x="700" y="680" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#71717A">Centered Card</text>
  <text x="700" y="770" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#A1A1AA">Login / Settings</text>
  
  <!-- Three Column -->
  <rect x="850" y="595" width="310" height="160" rx="8" fill="#111113" stroke="#27272A" stroke-width="1"/>
  <rect x="850" y="595" width="97" height="160" fill="#18181B"/>
  <rect x="947" y="595" width="97" height="160" fill="#0D0D0F"/>
  <rect x="1044" y="595" width="116" height="160" fill="#18181B"/>
  <text x="1005" y="680" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#71717A">3-Column</text>
  <text x="1005" y="770" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#A1A1AA">Marketplace</text>
</svg>