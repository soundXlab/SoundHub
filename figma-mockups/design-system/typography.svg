<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#0A0A0B"/>
  
  <!-- Title -->
  <text x="40" y="50" font-family="Inter, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">Design System — Typography</text>
  <text x="40" y="80" font-family="Inter, sans-serif" font-size="14" fill="#71717A">Font Scale &amp; Weights</text>
  
  <!-- Font Family -->
  <text x="40" y="130" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#52525B" letter-spacing="1">FONT FAMILY</text>
  
  <rect x="40" y="145" width="500" height="60" rx="12" fill="#111113" stroke="#27272A" stroke-width="1"/>
  <text x="60" y="175" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Inter</text>
  <text x="60" y="195" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Primary: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif</text>
  
  <rect x="560" y="145" width="300" height="60" rx="12" fill="#111113" stroke="#27272A" stroke-width="1"/>
  <text x="580" y="175" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" fill="#FFFFFF">JetBrains Mono</text>
  <text x="580" y="195" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Monospace: code, timestamps</text>
  
  <!-- Type Scale -->
  <text x="40" y="250" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#52525B" letter-spacing="1">TYPE SCALE</text>
  
  <!-- Display -->
  <rect x="40" y="270" width="1120" height="70" rx="8" fill="#111113"/>
  <text x="60" y="310" font-family="Inter, sans-serif" font-size="48" font-weight="900" fill="#FFFFFF">Display 64px</text>
  <text x="1100" y="300" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#52525B">font-size: 64px</text>
  <text x="1100" y="316" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#52525B">font-weight: 900</text>
  <text x="1100" y="332" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#52525B">line-height: 1.1</text>
  
  <!-- H1 -->
  <rect x="40" y="350" width="1120" height="60" rx="8" fill="#111113"/>
  <text x="60" y="390" font-family="Inter, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">Heading 1 — 32px</text>
  <text x="1100" y="380" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#52525B">font-size: 32px</text>
  <text x="1100" y="396" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#52525B">font-weight: 800</text>
  
  <!-- H2 -->
  <rect x="40" y="420" width="1120" height="50" rx="8" fill="#111113"/>
  <text x="60" y="452" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Heading 2 — 24px</text>
  <text x="1100" y="448" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#52525B">font-size: 24px</text>
  <text x="1100" y="462" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#52525B">font-weight: 700</text>
  
  <!-- H3 -->
  <rect x="40" y="480" width="1120" height="45" rx="8" fill="#111113"/>
  <text x="60" y="510" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Heading 3 — 20px</text>
  <text x="1100" y="506" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#52525B">font-size: 20px</text>
  <text x="1100" y="520" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#52525B">font-weight: 700</text>
  
  <!-- Body -->
  <rect x="40" y="535" width="1120" height="40" rx="8" fill="#111113"/>
  <text x="60" y="560" font-family="Inter, sans-serif" font-size="16" fill="#E4E4E7">Body — 16px — The quick brown fox jumps over the lazy dog</text>
  <text x="1100" y="558" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#52525B">font-size: 16px</text>
  <text x="1100" y="572" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#52525B">font-weight: 400</text>
  
  <!-- Caption -->
  <rect x="40" y="585" width="1120" height="35" rx="8" fill="#111113"/>
  <text x="60" y="608" font-family="Inter, sans-serif" font-size="14" fill="#A1A1AA">Caption — 14px — Metadata and secondary information</text>
  <text x="1100" y="604" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#52525B">font-size: 14px</text>
  
  <!-- Small -->
  <rect x="40" y="630" width="1120" height="30" rx="8" fill="#111113"/>
  <text x="60" y="650" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Small — 12px — Labels, hints, and fine print</text>
  <text x="1100" y="648" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#52525B">font-size: 12px</text>
  
  <!-- Mono -->
  <rect x="40" y="670" width="1120" height="30" rx="8" fill="#111113"/>
  <text x="60" y="690" font-family="JetBrains Mono, monospace" font-size="13" fill="#8B5CF6">Mono — 13px — 004:02:12:08 · 128 BPM · F# minor</text>
  <text x="1100" y="688" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#52525B">font-family: JetBrains Mono</text>
</svg>