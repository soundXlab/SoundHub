<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 900" 
     width="1440" 
     height="900">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — Slow Down</title><link rel="stylesheet" href="design-system/shared.css"><style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg-primary)}.rate-limit{text-align:center;max-width:480px;padding:40px}.rate-limit .icon{font-size:64px;margin-bottom:24px;opacity:0.3}.rate-limit h1{font-size:28px;font-weight:800;margin-bottom:12px}.rate-limit p{font-size:14px;color:var(--text-secondary);line-height:1.6;margin-bottom:24px}.countdown{font-family:var(--font-mono);font-size:32px;font-weight:800;color:var(--brand-primary);margin-bottom:24px}</style></head><body><div class="rate-limit"><div class="icon">⏱️</div><h1>Too Many Requests</h1><p>You've been making too many requests. Please wait a moment before trying again.</p><div class="countdown">00:42</div><p style="font-size:12px;color:var(--text-muted)">This page will refresh automatically</p></div></body></html>
    </div>
  </foreignObject>
</svg>