<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 900" 
     width="1440" 
     height="900">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — Release Package</title><link rel="stylesheet" href="design-system/shared.css"><style>.release-grid{display:grid;grid-template-columns:1fr 340px;gap:24px}.deliverable-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-default);font-size:13px}.deliverable-row:last-child{border-bottom:none}.preflight-check{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius-sm);font-size:12px;margin-bottom:4px}.preflight-check.pass{background:rgba(34,197,94,0.08);color:var(--color-success)}.preflight-check.fail{background:rgba(239,68,68,0.08);color:var(--color-error)}.preflight-check.warn{background:rgba(234,179,8,0.08);color:var(--color-warning)}.preflight-check.info{background:rgba(59,130,246,0.08);color:var(--color-info)}.pkg-status{display:flex;gap:12px;margin-bottom:16px}.pkg-step{flex:1;padding:12px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-md);text-align:center}.pkg-step.done{border-color:var(--color-success);background:rgba(34,197,94,0.05)}.pkg-step.active{border-color:var(--brand-primary);background:rgba(139,92,246,0.05)}.pkg-step .num{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-bottom:4px}.pkg-step.done .num{background:var(--color-success);color:white}.pkg-step.active .num{background:var(--brand-primary);color:white}.pkg-step .label{font-size:10px;color:var(--text-muted);text-transform:uppercase}</style></head><body><div class="app-layout"><aside class="sidebar"><div class="sidebar-logo"><div class="logo-icon">S</div><div class="logo-text">SoundHub</div></div><nav class="sidebar-nav"><div class="sidebar-section-label">Main</div><a class="sidebar-item" href="#"><span class="icon">📊</span> Dashboard</a><a class="sidebar-item" href="#"><span class="icon">📁</span> Projects</a><div class="sidebar-section-label">Workspace</div><a class="sidebar-item active" href="#"><span class="icon">📦</span> Release Packages</a><a class="sidebar-item" href="#"><span class="icon">💬</span> Reviews</a><div class="sidebar-section-label">Account</div><a class="sidebar-item" href="#"><span class="icon">⚙️</span> Settings</a></nav><div class="sidebar-footer"><a class="sidebar-item" href="#"><span class="icon">❓</span> Help</a></div></aside><div class="main-content"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><a href="#" style="color:var(--text-muted);text-decoration:none;font-size:13px">← Packages</a><span style="color:var(--text-muted)">/</span><span style="font-size:14px;font-weight:600">Label Sync Delivery</span></div><div class="topbar-right"><div class="topbar-avatar">P</div></div></header><div class="page"><div class="page-header"><div><h1 class="page-title">Release Package</h1><p class="page-subtitle">Label / sync delivery · Template: label_sync</p></div><div style="display:flex;gap:8px"><button class="btn btn-secondary">📋 Manifest</button><button class="btn btn-primary">📦 Lock Package</button></div></div><div class="pkg-status"><div class="pkg-step done"><div class="num">✓</div><div class="label">Created</div></div><div class="pkg-step done"><div class="num">✓</div><div class="label">Preflight</div></div><div class="pkg-step active"><div class="num">3</div><div class="label">Deliverables</div></div><div class="pkg-step"><div class="num">4</div><div class="label">Locked</div></div><div class="pkg-step"><div class="num">5</div><div class="label">Delivered</div></div></div><div class="release-grid"><div><div class="card" style="margin-bottom:16px"><div class="card-header"><span class="card-title">Preflight Checks</span><span class="badge badge-error">3 blocks</span></div><div class="card-body"><div class="preflight-check pass">✓ Master — uploaded (28.7 MB)</div><div class="preflight-check fail">✗ Instrumental — missing (required)</div><div class="preflight-check fail">✗ Acapella — missing (required)</div><div class="preflight-check fail">✗ Stems — missing (required)</div><div class="preflight-check warn">⚠ No watermark on approved version</div></div></div><div class="card"><div class="card-header"><span class="card-title">Deliverables</span><button class="btn btn-ghost btn-sm">+ Add</button></div><div class="card-body"><div class="deliverable-row"><span>🎵</span><span style="flex:1;font-weight:600">master.wav</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">28.7 MB</span><span class="badge badge-success" style="font-size:9px">Uploaded</span></div><div class="deliverable-row"><span>🎵</span><span style="flex:1;color:var(--text-muted)">instrumental.wav</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">—</span><span class="badge badge-error" style="font-size:9px">Missing</span></div><div class="deliverable-row"><span>🎵</span><span style="flex:1;color:var(--text-muted)">acapella.wav</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">—</span><span class="badge badge-error" style="font-size:9px">Missing</span></div><div class="deliverable-row"><span>🎵</span><span style="flex:1;color:var(--text-muted)">stems.zip</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">—</span><span class="badge badge-error" style="font-size:9px">Missing</span></div></div></div></div><div><div class="card" style="margin-bottom:16px"><div class="card-header"><span class="card-title">Package Info</span></div><div class="card-body"><div style="display:flex;flex-direction:column;gap:8px;font-size:12px"><div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">Template</span><span style="font-weight:600">Label / sync delivery</span></div><div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">Status</span><span class="badge badge-warning" style="font-size:9px">In Progress</span></div><div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">Version</span><span style="font-weight:600">v13</span></div><div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">Created</span><span style="font-weight:600">2h ago</span></div><div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">Locked by</span><span style="color:var(--text-muted)">—</span></div></div></div></div><div class="card"><div class="card-header"><span class="card-title">Required Deliverables</span></div><div class="card-body"><div style="font-size:12px;color:var(--text-secondary);line-height:1.8">✓ master<br>✗ instrumental<br>✗ acapella<br>✗ stems</div></div></div></div></div></div></div></div></body></html>
    </div>
  </foreignObject>
</svg>