<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 900" 
     width="1440" 
     height="900">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — Welcome</title><link rel="stylesheet" href="design-system/shared.css"><style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg-primary)}.onboarding{width:560px;text-align:center}.steps{display:flex;justify-content:center;gap:8px;margin-bottom:32px}.step-dot{width:32px;height:4px;border-radius:2px;background:var(--border-default)}.step-dot.active{background:var(--brand-primary);width:48px}.step-icon{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 20px;background:var(--bg-surface);border:2px solid var(--border-default)}.step-title{font-size:24px;font-weight:800;margin-bottom:8px;letter-spacing:-0.3px}.step-desc{font-size:14px;color:var(--text-secondary);line-height:1.6;margin-bottom:32px;max-width:400px;margin-left:auto;margin-right:auto}.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:32px}.role-card{padding:20px 16px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg);cursor:pointer;transition:all 0.15s}.role-card:hover{border-color:var(--border-hover)}.role-card.active{border-color:var(--brand-primary);background:rgba(139,92,246,0.05)}.role-card .icon{font-size:28px;margin-bottom:8px}.role-card .name{font-size:13px;font-weight:600}.role-card .desc{font-size:11px;color:var(--text-muted);margin-top:4px}</style></head><body><div class="onboarding"><div class="steps"><div class="step-dot active"></div><div class="step-dot"></div><div class="step-dot"></div></div><div class="step-icon">👋</div><div class="step-title">Welcome to SoundHub!</div><div class="step-desc">Let's set up your account in 30 seconds. What best describes you?</div><div class="role-grid"><div class="role-card active"><div class="icon">🎹</div><div class="name">Producer</div><div class="desc">I make music and need feedback</div></div><div class="role-card"><div class="icon">🎚️</div><div class="name">Engineer</div><div class="desc">I mix, master, and review</div></div><div class="role-card"><div class="icon">🏷️</div><div class="name">Label</div><div class="desc">I manage releases and artists</div></div></div><button class="btn btn-primary btn-lg" style="width:100%;justify-content:center">Continue →</button><div style="margin-top:12px"><button class="btn btn-ghost">Skip for now</button></div></div></body></html>
    </div>
  </foreignObject>
</svg>