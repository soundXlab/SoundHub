<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 900" 
     width="1440" 
     height="900">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — Blog</title><link rel="stylesheet" href="design-system/shared.css"><style>.blog-card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:border-color 0.15s}.blog-card:hover{border-color:var(--border-hover)}.blog-thumb{height:160px;background:var(--bg-elevated)}.blog-body{padding:20px}.blog-date{font-size:11px;color:var(--text-muted);margin-bottom:8px}.blog-title{font-size:16px;font-weight:700;margin-bottom:8px;line-height:1.3}.blog-excerpt{font-size:13px;color:var(--text-secondary);line-height:1.5;margin-bottom:12px}.blog-tag{display:inline-flex;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600;background:rgba(139,92,246,0.12);color:var(--brand-primary);margin-right:4px}</style></head><body><nav class="pricing-nav"><span class="logo" style="font-size:18px;font-weight:800;color:var(--brand-accent)">🎵 SoundHub</span><span class="spacer"></span><a href="#">Features</a><a href="#">Docs</a><a href="#">Pricing</a><a href="#" style="font-weight:600;color:var(--text-primary)">Blog</a><a href="#">Sign in</a><button class="btn btn-primary btn-sm">Get Started</button></nav><div style="max-width:1100px;margin:0 auto;padding:40px"><h1 style="font-size:32px;font-weight:800;margin-bottom:8px">Blog</h1><p style="font-size:14px;color:var(--text-secondary);margin-bottom:32px">Updates, tutorials, and stories from the SoundHub team</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px"><div class="blog-card"><div class="blog-thumb" style="background:linear-gradient(135deg,rgba(139,92,246,0.2),rgba(6,182,212,0.1))"></div><div class="blog-body"><div class="blog-date">August 29, 2026</div><div class="blog-title">Introducing Audio CI: Automated Quality Checks</div><div class="blog-excerpt">Every upload now gets automatic loudness, peak, and metadata analysis. Here's how it works.</div><div><span class="blog-tag">Product</span><span class="blog-tag">Audio CI</span></div></div></div><div class="blog-card"><div class="blog-thumb" style="background:linear-gradient(135deg,rgba(34,197,94,0.2),rgba(234,179,8,0.1))"></div><div class="blog-body"><div class="blog-date">August 22, 2026</div><div class="blog-title">Release Packages: Ship Music Faster</div><div class="blog-excerpt">How to use release packages to deliver masters, stems, and instrumentals to labels.</div><div><span class="blog-tag">Tutorial</span></div></div></div><div class="blog-card"><div class="blog-thumb" style="background:linear-gradient(135deg,rgba(239,68,68,0.2),rgba(234,179,8,0.1))"></div><div class="blog-body"><div class="blog-date">August 15, 2026</div><div class="blog-title">Voice Notes: Leave Audio Feedback</div><div class="blog-excerpt">New feature: record voice comments directly on the waveform timeline.</div><div><span class="blog-tag">Feature</span></div></div></div></div></div></body></html>
    </div>
  </foreignObject>
</svg>