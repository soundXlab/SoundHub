<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 1597" 
     width="1440" 
     height="1597">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>SoundHub — Settings</title>
  <link rel="stylesheet" href="design-system/shared.css">
  <style>
    .settings-layout { display: flex; gap: 32px; }
    .settings-nav { width: 220px; flex-shrink: 0; }
    .settings-nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }
    .settings-nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .settings-nav-item.active { background: rgba(139,92,246,0.12); color: var(--brand-primary); font-weight: 600; }
    .settings-content { flex: 1; max-width: 640px; }
    .settings-section {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      margin-bottom: 20px;
    }
    .settings-section-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-default);
    }
    .settings-section-title { font-size: 16px; font-weight: 700; }
    .settings-section-desc { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
    .settings-section-body { padding: 24px; }
    .settings-row {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--border-default);
      gap: 24px;
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row-label { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .settings-row-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .settings-row-control { flex-shrink: 0; min-width: 200px; display: flex; justify-content: flex-end; }
    .toggle {
      width: 40px; height: 22px;
      background: var(--border-default);
      border-radius: 11px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle.on { background: var(--brand-primary); }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 18px; height: 18px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(18px); }
    .danger-zone {
      border-color: rgba(239,68,68,0.3);
    }
    .danger-zone .settings-section-header {
      border-bottom-color: rgba(239,68,68,0.1);
    }
    .api-key {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      background: var(--bg-primary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
    }
    .avatar-upload {
      display: flex; align-items: center; gap: 16px;
    }
    .avatar-large {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--brand-gradient);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; color: white;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo"><div class="logo-icon">S</div><div class="logo-text">SoundHub</div></div>
      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Main</div>
        <a class="sidebar-item" href="#"><span class="icon">📊</span> Dashboard</a>
        <a class="sidebar-item" href="#"><span class="icon">📁</span> Projects</a>
        <a class="sidebar-item" href="#"><span class="icon">🛒</span> Marketplace</a>
        <div class="sidebar-section-label">Account</div>
        <a class="sidebar-item active" href="#"><span class="icon">⚙️</span> Settings</a>
        <a class="sidebar-item" href="#"><span class="icon">📊</span> Analytics</a>
      </nav>
      <div class="sidebar-footer"><a class="sidebar-item" href="#"><span class="icon">❓</span> Help</a></div>
    </aside>
    <div class="main-content">
      <header class="topbar">
        <div style="font-size:14px;font-weight:600">Settings</div>
        <div class="topbar-right"><div class="topbar-avatar">P</div></div>
      </header>
      <div class="page">
        <h1 class="page-title" style="margin-bottom:24px">Settings</h1>
        <div class="settings-layout">
          <!-- Nav -->
          <div class="settings-nav">
            <div class="settings-nav-item active">👤 Profile</div>
            <div class="settings-nav-item">🎨 Appearance</div>
            <div class="settings-nav-item">🔒 Security</div>
            <div class="settings-nav-item">🔔 Notifications</div>
            <div class="settings-nav-item">💳 Billing</div>
            <div class="settings-nav-item">💾 Storage</div>
            <div class="settings-nav-item">🔑 API Keys</div>
            <div class="settings-nav-item" style="color:var(--color-error)">⚠️ Danger Zone</div>
          </div>

          <!-- Content -->
          <div class="settings-content">
            <!-- Profile -->
            <div class="settings-section">
              <div class="settings-section-header">
                <div class="settings-section-title">Profile</div>
                <div class="settings-section-desc">Manage your public profile and account details</div>
              </div>
              <div class="settings-section-body">
                <div class="avatar-upload" style="margin-bottom:20px">
                  <div class="avatar-large">P</div>
                  <div>
                    <button class="btn btn-secondary btn-sm">Change avatar</button>
                    <div style="font-size:11px;color:var(--text-muted);margin-top:4px">JPG, PNG or GIF. Max 2MB.</div>
                  </div>
                </div>
                <div style="display:flex;flex-direction:column;gap:16px">
                  <div class="grid-2">
                    <div class="form-group">
                      <label class="form-label">Display Name</label>
                      <input class="form-input" value="Producer">
                    </div>
                    <div class="form-group">
                      <label class="form-label">Username</label>
                      <input class="form-input" value="producer">
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Email</label>
                    <input class="form-input" value="producer@soundhub.io" type="email">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Bio</label>
                    <input class="form-input" value="Electronic music producer based in Berlin" placeholder="Tell us about yourself">
                  </div>
                  <div style="display:flex;justify-content:flex-end">
                    <button class="btn btn-primary">Save changes</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Notifications -->
            <div class="settings-section">
              <div class="settings-section-header">
                <div class="settings-section-title">Notifications</div>
                <div class="settings-section-desc">Choose what updates you receive</div>
              </div>
              <div class="settings-section-body">
                <div class="settings-row">
                  <div>
                    <div class="settings-row-label">Review comments</div>
                    <div class="settings-row-desc">When someone comments on your project</div>
                  </div>
                  <div class="settings-row-control"><div class="toggle on"></div></div>
                </div>
                <div class="settings-row">
                  <div>
                    <div class="settings-row-label">Version approvals</div>
                    <div class="settings-row-desc">When your version is approved or needs changes</div>
                  </div>
                  <div class="settings-row-control"><div class="toggle on"></div></div>
                </div>
                <div class="settings-row">
                  <div>
                    <div class="settings-row-label">Marketplace downloads</div>
                    <div class="settings-row-desc">When someone downloads your asset</div>
                  </div>
                  <div class="settings-row-control"><div class="toggle"></div></div>
                </div>
                <div class="settings-row">
                  <div>
                    <div class="settings-row-label">Processing complete</div>
                    <div class="settings-row-desc">When upload processing finishes</div>
                  </div>
                  <div class="settings-row-control"><div class="toggle on"></div></div>
                </div>
              </div>
            </div>

            <!-- API Keys -->
            <div class="settings-section">
              <div class="settings-section-header">
                <div class="settings-section-title">API Keys</div>
                <div class="settings-section-desc">Manage API access for integrations and CLI</div>
              </div>
              <div class="settings-section-body">
                <div style="display:flex;flex-direction:column;gap:12px">
                  <div class="api-key">
                    <span style="flex:1">snd_****_****_k7x2</span>
                    <span class="badge badge-success">Active</span>
                    <button class="btn btn-ghost btn-sm">Copy</button>
                    <button class="btn btn-ghost btn-sm" style="color:var(--color-error)">Revoke</button>
                  </div>
                  <button class="btn btn-outline btn-sm" style="align-self:flex-start">+ Generate new key</button>
                </div>
              </div>
            </div>

            <!-- Danger Zone -->
            <div class="settings-section danger-zone">
              <div class="settings-section-header">
                <div class="settings-section-title" style="color:var(--color-error)">Danger Zone</div>
                <div class="settings-section-desc">Irreversible actions</div>
              </div>
              <div class="settings-section-body">
                <div class="settings-row">
                  <div>
                    <div class="settings-row-label">Delete account</div>
                    <div class="settings-row-desc">Permanently delete your account and all data</div>
                  </div>
                  <div class="settings-row-control">
                    <button class="btn btn-danger">Delete account</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>


</body></html>
    </div>
  </foreignObject>
</svg>