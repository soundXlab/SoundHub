<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 900" 
     width="1440" 
     height="900">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>SoundHub — Login</title>
  <link rel="stylesheet" href="design-system/shared.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-bg {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 30% 50%, rgba(139,92,246,0.08) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 50%, rgba(6,182,212,0.05) 0%, transparent 60%),
                  var(--bg-primary);
    }
    .login-card {
      position: relative; z-index: 1;
      width: 400px;
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      padding: 40px;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo .icon {
      width: 48px; height: 48px;
      background: var(--brand-gradient);
      border-radius: var(--radius-lg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      color: white;
      margin-bottom: 16px;
    }
    .login-logo h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .login-logo p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .login-form { display: flex; flex-direction: column; gap: 16px; }
    .login-divider {
      display: flex; align-items: center; gap: 12px;
      font-size: 12px; color: var(--text-muted);
      margin: 4px 0;
    }
    .login-divider::before, .login-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border-default);
    }
    .social-buttons { display: flex; flex-direction: column; gap: 10px; }
    .social-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-default);
      background: var(--bg-primary);
      color: var(--text-secondary);
      font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }
    .social-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }
    .social-btn.wallet { border-color: #F6851B; color: #F6851B; }
    .social-btn.wallet:hover { background: rgba(246,133,27,0.08); }
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .login-footer a {
      color: var(--brand-primary);
      text-decoration: none;
      font-weight: 500;
    }
    .login-terms {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .login-terms a { color: var(--text-secondary); text-decoration: underline; }
    /* Tabs for Login/Register */
    .auth-tabs {
      display: flex;
      background: var(--bg-primary);
      border-radius: var(--radius-sm);
      padding: 3px;
      margin-bottom: 24px;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 8px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .auth-tab.active {
      background: var(--bg-surface);
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="login-bg"></div>
  <div class="login-card">
    <div class="login-logo">
      <div class="icon">S</div>
      <h1>SoundHub</h1>
      <p>Version, review, and release music — without the chaos</p>
    </div>

    <div class="auth-tabs">
      <div class="auth-tab active">Sign In</div>
      <div class="auth-tab">Sign Up</div>
    </div>

    <form class="login-form">
      <div class="form-group">
        <label class="form-label">Email or Username</label>
        <input class="form-input" type="text" placeholder="demo" value="demo">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" placeholder="••••••••" value="••••••••">
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <label style="font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" checked="" style="accent-color:var(--brand-primary)"> Remember me
        </label>
        <a href="#" style="font-size:12px;color:var(--brand-primary);text-decoration:none">Forgot password?</a>
      </div>
      <button class="btn btn-primary btn-lg" style="width:100%;justify-content:center">Sign In</button>
    </form>

    <div class="login-divider">or continue with</div>

    <div class="social-buttons">
      <div class="social-btn wallet">🦊 Sign in with Wallet</div>
      <div class="social-btn">🔗 Sign in with Discord</div>
    </div>

    <div class="login-footer">
      Don't have an account? <a href="#">Create one</a>
    </div>
    <div class="login-terms">
      By signing in, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>
    </div>
  </div>


</body></html>
    </div>
  </foreignObject>
</svg>