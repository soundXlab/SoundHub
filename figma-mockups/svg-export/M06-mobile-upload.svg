<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 900" 
     width="1440" 
     height="900">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=390"><title>SoundHub — Mobile Upload</title><link rel="stylesheet" href="design-system/shared.css"><style>body{background:var(--bg-primary);display:flex;justify-content:center}.mobile{width:390px;min-height:100vh;background:var(--bg-primary)}.mobile-topbar{height:48px;background:var(--bg-panel);border-bottom:1px solid var(--border-default);display:flex;align-items:center;padding:0 16px;gap:12px;position:sticky;top:0;z-index:10}.mobile-content{padding:16px}.upload-zone-m{border:2px dashed var(--border-hover);border-radius:var(--radius-lg);padding:32px;text-align:center;margin-bottom:16px}.step-m{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-default)}.step-num-m{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}.step-num-m.done{background:var(--color-success);color:white}.step-num-m.active{background:var(--brand-primary);color:white}.step-num-m.pending{background:var(--bg-elevated);color:var(--text-muted);border:1px solid var(--border-default)}</style></head><body><div class="mobile"><div class="mobile-topbar"><span style="font-size:16px">←</span><span style="font-size:14px;font-weight:600">Upload</span></div><div class="mobile-content"><div class="upload-zone-m"><div style="font-size:40px;margin-bottom:8px;opacity:0.4">📁</div><div style="font-size:13px;color:var(--text-secondary)">Tap to select files</div><div style="font-size:11px;color:var(--text-muted);margin-top:4px">.als, .flp, .wav, .aiff</div></div><div class="form-group" style="margin-bottom:12px"><label class="form-label">Project Name</label><input class="form-input" value="Neon Warehouse" style="width:100%"></div><div style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px">Processing</div><div class="step-m"><div class="step-num-m done">✓</div><div style="flex:1"><div style="font-size:12px;font-weight:500">Uploading</div><div style="font-size:10px;color:var(--text-muted)">Complete — 28.7 MB</div></div></div><div class="step-m"><div class="step-num-m active">2</div><div style="flex:1"><div style="font-size:12px;font-weight:500">Verifying hash</div><div style="font-size:10px;color:var(--text-muted)">In progress...</div></div></div><div class="step-m"><div class="step-num-m pending">3</div><div style="flex:1"><div style="font-size:12px;font-weight:500">Generating waveform</div><div style="font-size:10px;color:var(--text-muted)">Queued</div></div></div><div class="step-m" style="border:none"><div class="step-num-m pending">4</div><div style="flex:1"><div style="font-size:12px;font-weight:500">Audio checks</div><div style="font-size:10px;color:var(--text-muted)">Queued</div></div></div><div style="margin-top:16px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span style="color:var(--text-secondary)">Progress</span><span style="color:var(--brand-primary);font-weight:600">35%</span></div><div class="progress-bar"><div class="progress-fill" style="width:35%"></div></div></div></div></div></body></html>
    </div>
  </foreignObject>
</svg>