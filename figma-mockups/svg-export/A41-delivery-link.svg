<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 900" 
     width="1440" 
     height="900">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — Delivery</title><link rel="stylesheet" href="design-system/shared.css"><style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg-primary)}.delivery-card{width:560px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-xl);overflow:hidden}.delivery-hero{padding:32px;text-align:center;border-bottom:1px solid var(--border-default)}.delivery-hero .icon{width:56px;height:56px;background:var(--brand-gradient);border-radius:var(--radius-lg);display:inline-flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:white;margin-bottom:16px}.delivery-hero h1{font-size:22px;font-weight:800;margin-bottom:4px}.delivery-hero p{font-size:13px;color:var(--text-secondary)}.delivery-files{padding:20px 24px}.delivery-file{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-md);margin-bottom:8px;transition:border-color 0.15s}.delivery-file:hover{border-color:var(--brand-primary)}.delivery-file .info{flex:1}.delivery-file .name{font-size:13px;font-weight:600}.delivery-file .meta{font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}.delivery-meta{padding:16px 24px;border-top:1px solid var(--border-default);display:flex;gap:16px;font-size:11px;color:var(--text-muted)}.delivery-footer{padding:16px 24px;border-top:1px solid var(--border-default);text-align:center;font-size:11px;color:var(--text-muted)}</style></head><body><div class="delivery-card"><div class="delivery-hero"><div class="icon">S</div><h1>Neon Warehouse</h1><p>Label / sync delivery · v13 · Ready for download</p></div><div class="delivery-files"><div class="delivery-file"><span style="font-size:20px">🎵</span><div class="info"><div class="name">master.wav</div><div class="meta">WAV 24bit · 44.1kHz · Stereo · 28.7 MB</div></div><button class="btn btn-primary btn-sm">⬇ Download</button></div><div class="delivery-file"><span style="font-size:20px">🎵</span><div class="info"><div class="name">instrumental.wav</div><div class="meta">WAV 24bit · 44.1kHz · Stereo · 27.3 MB</div></div><button class="btn btn-primary btn-sm">⬇ Download</button></div><div class="delivery-file"><span style="font-size:20px">📁</span><div class="info"><div class="name">stems.zip</div><div class="meta">ZIP · 4 stems · 124.3 MB</div></div><button class="btn btn-primary btn-sm">⬇ Download</button></div></div><div class="delivery-meta"><span>📦 Label Sync Delivery</span><span>🔒 SHA-256 verified</span><span>📅 Retained until Nov 15, 2026</span></div><div class="delivery-footer">Powered by SoundHub · This link expires in 30 days</div></div></body></html>
    </div>
  </foreignObject>
</svg>