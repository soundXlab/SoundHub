<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 900" 
     width="1440" 
     height="900">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — Storage</title><link rel="stylesheet" href="design-system/shared.css"><style>.storage-usage{display:flex;height:24px;border-radius:var(--radius-sm);overflow:hidden;margin:16px 0}.storage-seg{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:white;transition:width 0.3s}.storage-breakdown{display:flex;flex-direction:column;gap:10px;margin-top:16px}.storage-item{display:flex;align-items:center;gap:10px;font-size:13px}.storage-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}</style></head><body><div class="app-layout"><aside class="sidebar"><div class="sidebar-logo"><div class="logo-icon">S</div><div class="logo-text">SoundHub</div></div><nav class="sidebar-nav"><div class="sidebar-section-label">Main</div><a class="sidebar-item" href="#"><span class="icon">📊</span> Dashboard</a><div class="sidebar-section-label">Account</div><a class="sidebar-item active" href="#"><span class="icon">⚙️</span> Settings</a></nav><div class="sidebar-footer"><a class="sidebar-item" href="#"><span class="icon">❓</span> Help</a></div></aside><div class="main-content"><header class="topbar"><div style="font-size:14px;font-weight:600">Settings</div><div class="topbar-right"><div class="topbar-avatar">P</div></div></header><div class="page"><h1 class="page-title" style="margin-bottom:24px">Storage Management</h1><div class="card" style="margin-bottom:20px"><div class="card-body"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:14px;font-weight:700">2.4 GB / 50 GB</span><span style="font-size:13px;color:var(--text-muted)">4.8% used</span></div><div class="progress-bar" style="height:12px"><div class="progress-fill" style="width:4.8%"></div></div><div class="storage-usage"><div class="storage-seg" style="width:3%;background:var(--brand-primary)"></div><div class="storage-seg" style="width:1.5%;background:var(--brand-secondary)"></div><div class="storage-seg" style="width:0.3%;background:var(--color-warning)"></div></div><div class="storage-breakdown"><div class="storage-item"><div class="storage-dot" style="background:var(--brand-primary)"></div><span style="flex:1">Audio files (projects)</span><span style="font-family:var(--font-mono);font-size:12px">1.5 GB</span></div><div class="storage-item"><div class="storage-dot" style="background:var(--brand-secondary)"></div><span style="flex:1">Marketplace assets</span><span style="font-family:var(--font-mono);font-size:12px">800 MB</span></div><div class="storage-item"><div class="storage-dot" style="background:var(--color-warning)"></div><span style="flex:1">Other (metadata, waveforms)</span><span style="font-family:var(--font-mono);font-size:12px">120 MB</span></div></div></div></div><div class="card"><div class="card-header"><span class="card-title">Largest Files</span></div><div class="card-body" style="padding:0"><table class="table"><thead><tr><th>File</th><th>Project</th><th>Size</th><th>Added</th><th></th></tr></thead><tbody><tr><td style="font-weight:600">mixdown.wav</td><td>Neon Warehouse</td><td style="font-family:var(--font-mono)">28.7 MB</td><td style="color:var(--text-muted)">2h ago</td><td><button class="btn btn-ghost btn-sm" style="color:var(--color-error)">Delete</button></td></tr><tr><td style="font-weight:600">stems.zip</td><td>Summer Drums</td><td style="font-family:var(--font-mono)">124.3 MB</td><td style="color:var(--text-muted)">5d ago</td><td><button class="btn btn-ghost btn-sm" style="color:var(--color-error)">Delete</button></td></tr><tr><td style="font-weight:600">full_pack.zip</td><td>Lo-Fi Drums (Marketplace)</td><td style="font-family:var(--font-mono)">12.4 MB</td><td style="color:var(--text-muted)">Aug 15</td><td><button class="btn btn-ghost btn-sm" style="color:var(--color-error)">Delete</button></td></tr></tbody></table></div></div></div></div></div></body></html>
    </div>
  </foreignObject>
</svg>