<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 1005" 
     width="1440" 
     height="1005">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — About</title><link rel="stylesheet" href="design-system/shared.css"><style>nav.pricing-nav{display:flex;align-items:center;gap:24px;padding:16px 40px;border-bottom:1px solid var(--border-default);width:100%}.about-hero{text-align:center;padding:80px 40px;max-width:700px;margin:0 auto}.about-hero h1{font-size:40px;font-weight:800;letter-spacing:-0.5px;margin-bottom:16px}.about-hero p{font-size:16px;color:var(--text-secondary);line-height:1.7}.about-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1100px;margin:0 auto;padding:0 40px 80px}.about-card{padding:32px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg);text-align:center}.about-card .icon{font-size:32px;margin-bottom:12px}.about-card h3{font-size:16px;font-weight:700;margin-bottom:8px}.about-card p{font-size:13px;color:var(--text-secondary);line-height:1.5}.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;max-width:1100px;margin:0 auto;padding:0 40px 80px}.team-member{text-align:center}.team-avatar{width:80px;height:80px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:white}.team-name{font-size:14px;font-weight:600}.team-role{font-size:12px;color:var(--text-muted)}</style></head><body><nav class="pricing-nav"><span style="font-size:18px;font-weight:800;color:var(--brand-accent)">🎵 SoundHub</span><span style="flex:1"></span><a href="#" style="font-size:13px;color:var(--text-secondary);text-decoration:none">Features</a><a href="#" style="font-size:13px;color:var(--text-secondary);text-decoration:none">Docs</a><a href="#" style="font-size:13px;color:var(--text-secondary);text-decoration:none">Pricing</a><a href="#" style="font-size:13px;color:var(--text-secondary);text-decoration:none">Blog</a><a href="#" style="font-size:13px;color:var(--text-secondary);text-decoration:none">Sign in</a><button class="btn btn-primary btn-sm">Get Started</button></nav><div class="about-hero"><h1>Music collaboration, reimagined</h1><p>SoundHub was born from a simple frustration: music collaboration shouldn't require zip files, Discord threads, and lost feedback. We're building the platform we always wished existed.</p></div><div class="about-grid"><div class="about-card"><div class="icon">🎵</div><h3>For Musicians</h3><p>Version control, reviews, and publishing — all in one place. No more email chains with attachments.</p></div><div class="about-card"><div class="icon">🌍</div><h3>Open Marketplace</h3><p>Sell your sounds directly to producers worldwide. Royalty-free licensing built in.</p></div><div class="about-card"><div class="icon">🔗</div><h3>DAW Integration</h3><p>Works with Ableton, FL Studio, REAPER, and more. Your workflow, enhanced.</p></div></div><h2 style="text-align:center;font-size:24px;font-weight:700;margin-bottom:24px">The Team</h2><div class="team-grid"><div class="team-member"><div class="team-avatar" style="background:var(--brand-gradient)">A</div><div class="team-name">Alex</div><div class="team-role">Founder &amp; CEO</div></div><div class="team-member"><div class="team-avatar" style="background:var(--brand-secondary)">S</div><div class="team-name">Sarah</div><div class="team-role">Lead Engineer</div></div><div class="team-member"><div class="team-avatar" style="background:var(--color-warning)">M</div><div class="team-name">Maya</div><div class="team-role">Design</div></div><div class="team-member"><div class="team-avatar" style="background:var(--color-success)">J</div><div class="team-name">Jordan</div><div class="team-role">Audio Engineer</div></div></div></body></html>
    </div>
  </foreignObject>
</svg>