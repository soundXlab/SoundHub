<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 900" 
     width="1440" 
     height="900">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>SoundHub — Files</title>
  <link rel="stylesheet" href="design-system/shared.css">
  <style>
    .files-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .file-table { width: 100%; border-collapse: collapse; }
    .file-table th { text-align: left; padding: 10px 16px; font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 1px solid var(--border-default); }
    .file-table td { padding: 12px 16px; font-size: 13px; color: var(--text-secondary); border-bottom: 1px solid var(--border-default); }
    .file-table tr:hover td { background: var(--bg-hover); }
    .file-table .file-name { font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
    .file-type-badge { display: inline-flex; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 600; text-transform: uppercase; }
    .file-type-badge.wav { background: rgba(139,92,246,0.12); color: var(--brand-primary); }
    .file-type-badge.mp3 { background: rgba(6,182,212,0.12); color: var(--brand-secondary); }
    .file-type-badge.zip { background: rgba(234,179,8,0.12); color: var(--color-warning); }
    .file-type-badge.als { background: rgba(34,197,94,0.12); color: var(--color-success); }
    .storage-bar { height: 8px; background: var(--border-default); border-radius: 4px; overflow: hidden; margin-top: 8px; }
    .storage-fill { height: 100%; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo"><div class="logo-icon">S</div><div class="logo-text">SoundHub</div></div>
      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Main</div>
        <a class="sidebar-item" href="#"><span class="icon">📊</span> Dashboard</a>
        <a class="sidebar-item active" href="#"><span class="icon">📁</span> Projects</a>
        <div class="sidebar-section-label">Workspace</div>
        <a class="sidebar-item" href="#"><span class="icon">💬</span> Reviews</a>
        <div class="sidebar-section-label">Account</div>
        <a class="sidebar-item" href="#"><span class="icon">⚙️</span> Settings</a>
      </nav>
      <div class="sidebar-footer"><a class="sidebar-item" href="#"><span class="icon">❓</span> Help</a></div>
    </aside>
    <div class="main-content">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <a href="#" style="color:var(--text-muted);text-decoration:none;font-size:13px">← Neon Warehouse</a>
          <span style="color:var(--text-muted)">/</span>
          <span style="font-size:14px;font-weight:600">Files</span>
        </div>
        <div class="topbar-right"><div class="topbar-avatar">P</div></div>
      </header>
      <div class="page">
        <div class="page-header">
          <div>
            <h1 class="page-title">Files</h1>
            <p class="page-subtitle">4 files · 54.4 MB of 50 GB used</p>
          </div>
          <button class="btn btn-primary">⬆️ Upload files</button>
        </div>

        <!-- Storage -->
        <div class="card" style="margin-bottom:20px">
          <div class="card-body" style="padding:14px 20px">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:12px;font-weight:600">Storage</span>
              <span style="font-size:12px;color:var(--text-muted)">54.4 MB / 50 GB (0.1%)</span>
            </div>
            <div class="storage-bar"><div class="storage-fill" style="width:0.1%;background:var(--brand-primary)"></div></div>
          </div>
        </div>

        <!-- Files Table -->
        <div class="card">
          <div class="files-toolbar" style="padding:12px 16px;border-bottom:1px solid var(--border-default)">
            <div style="display:flex;gap:8px">
              <button class="btn btn-ghost btn-sm">All</button>
              <button class="btn btn-ghost btn-sm">Audio</button>
              <button class="btn btn-ghost btn-sm">DAW</button>
              <button class="btn btn-ghost btn-sm">Other</button>
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn btn-ghost btn-sm">Sort: Name ▾</button>
            </div>
          </div>
          <table class="file-table">
            <thead>
              <tr><th>Name</th><th>Type</th><th>Size</th><th>Sample Rate</th><th>Bit Depth</th><th>Duration</th><th>Added</th><th></th></tr>
            </thead>
            <tbody>
              <tr>
                <td><span class="file-name">🎵 mixdown.wav</span></td>
                <td><span class="file-type-badge wav">WAV</span></td>
                <td style="font-family:var(--font-mono)">28.7 MB</td>
                <td style="font-family:var(--font-mono)">44.1 kHz</td>
                <td style="font-family:var(--font-mono)">24 bit</td>
                <td style="font-family:var(--font-mono)">3:42</td>
                <td>2h ago</td>
                <td><button class="btn btn-ghost btn-sm">⋯</button></td>
              </tr>
              <tr>
                <td><span class="file-name">🎵 drums.wav</span></td>
                <td><span class="file-type-badge wav">WAV</span></td>
                <td style="font-family:var(--font-mono)">12.4 MB</td>
                <td style="font-family:var(--font-mono)">44.1 kHz</td>
                <td style="font-family:var(--font-mono)">24 bit</td>
                <td style="font-family:var(--font-mono)">3:42</td>
                <td>2h ago</td>
                <td><button class="btn btn-ghost btn-sm">⋯</button></td>
              </tr>
              <tr>
                <td><span class="file-name">🎵 bass.wav</span></td>
                <td><span class="file-type-badge wav">WAV</span></td>
                <td style="font-family:var(--font-mono)">8.2 MB</td>
                <td style="font-family:var(--font-mono)">44.1 kHz</td>
                <td style="font-family:var(--font-mono)">24 bit</td>
                <td style="font-family:var(--font-mono)">3:42</td>
                <td>2h ago</td>
                <td><button class="btn btn-ghost btn-sm">⋯</button></td>
              </tr>
              <tr>
                <td><span class="file-name">🎵 synth.wav</span></td>
                <td><span class="file-type-badge wav">WAV</span></td>
                <td style="font-family:var(--font-mono)">5.1 MB</td>
                <td style="font-family:var(--font-mono)">44.1 kHz</td>
                <td style="font-family:var(--font-mono)">16 bit</td>
                <td style="font-family:var(--font-mono)">3:42</td>
                <td>2h ago</td>
                <td><button class="btn btn-ghost btn-sm">⋯</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>


</body></html>
    </div>
  </foreignObject>
</svg>