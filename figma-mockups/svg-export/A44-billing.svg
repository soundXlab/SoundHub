<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — Billing</title><link rel="stylesheet" href="design-system/shared.css"></head><body><div class="app-layout"><aside class="sidebar"><div class="sidebar-logo"><div class="logo-icon">S</div><div class="logo-text">SoundHub</div></div><nav class="sidebar-nav"><div class="sidebar-section-label">Main</div><a class="sidebar-item" href="#"><span class="icon">📊</span> Dashboard</a><div class="sidebar-section-label">Account</div><a class="sidebar-item active" href="#"><span class="icon">⚙️</span> Settings</a></nav><div class="sidebar-footer"><a class="sidebar-item" href="#"><span class="icon">❓</span> Help</a></div></aside><div class="main-content"><header class="topbar"><div style="font-size:14px;font-weight:600">Settings</div><div class="topbar-right"><div class="topbar-avatar">P</div></div></header><div class="page"><h1 class="page-title" style="margin-bottom:24px">Billing &amp; Plans</h1><div class="grid-2" style="gap:24px"><div><div class="card" style="margin-bottom:20px"><div class="card-header"><span class="card-title">Current Plan</span><span class="badge badge-purple">Pro</span></div><div class="card-body"><div style="display:flex;align-items:baseline;gap:8px;margin-bottom:12px"><span style="font-size:32px;font-weight:800">$19</span><span style="font-size:13px;color:var(--text-muted)">/month</span></div><div style="font-size:12px;color:var(--text-secondary);margin-bottom:16px">Renews on Sep 15, 2026</div><div style="display:flex;gap:8px"><button class="btn btn-secondary btn-sm">Change plan</button><button class="btn btn-ghost btn-sm" style="color:var(--color-error)">Cancel</button></div></div></div><div class="card"><div class="card-header"><span class="card-title">Payment Method</span></div><div class="card-body"><div style="display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg-elevated);border-radius:var(--radius-sm)"><span style="font-size:24px">🦊</span><div style="flex:1"><div style="font-size:13px;font-weight:600">MetaMask</div><div style="font-size:11px;color:var(--text-muted)">0x1234...5678</div></div><span class="badge badge-success" style="font-size:9px">Connected</span></div></div></div></div><div class="card"><div class="card-header"><span class="card-title">Invoices</span></div><div class="card-body" style="padding:0"><table class="table"><thead><tr><th>Date</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody><tr><td>Aug 15, 2026</td><td style="font-weight:600">$19.00</td><td><span class="badge badge-success" style="font-size:9px">Paid</span></td><td><button class="btn btn-ghost btn-sm">PDF</button></td></tr><tr><td>Jul 15, 2026</td><td style="font-weight:600">$19.00</td><td><span class="badge badge-success" style="font-size:9px">Paid</span></td><td><button class="btn btn-ghost btn-sm">PDF</button></td></tr><tr><td>Jun 15, 2026</td><td style="font-weight:600">$19.00</td><td><span class="badge badge-success" style="font-size:9px">Paid</span></td><td><button class="btn btn-ghost btn-sm">PDF</button></td></tr></tbody></table></div></div></div></div></div></div></body></html>
