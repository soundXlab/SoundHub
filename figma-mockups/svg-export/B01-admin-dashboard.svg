     height="900">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — Admin</title><link rel="stylesheet" href="design-system/shared.css"><style>.admin-badge{display:inline-flex;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;background:rgba(239,68,68,0.12);color:var(--color-error);margin-left:8px}</style></head><body><div class="app-layout"><aside class="sidebar" style="background:#0f0f11"><div class="sidebar-logo"><div class="logo-icon" style="background:var(--color-error)">A</div><div class="logo-text">Admin</div></div><nav class="sidebar-nav"><div class="sidebar-section-label">Platform</div><a class="sidebar-item active" href="#"><span class="icon">📊</span> Dashboard</a><a class="sidebar-item" href="#"><span class="icon">👥</span> Users</a><a class="sidebar-item" href="#"><span class="icon">📦</span> Content</a><a class="sidebar-item" href="#"><span class="icon">💰</span> Revenue</a><a class="sidebar-item" href="#"><span class="icon">🔧</span> System</a></nav><div class="sidebar-footer"><a class="sidebar-item" href="#"><span class="icon">←</span> Back to app</a></div></aside><div class="main-content"><header class="topbar"><div style="font-size:14px;font-weight:600">Admin Dashboard <span class="admin-badge">ADMIN</span></div><div class="topbar-right"><div class="topbar-avatar" style="background:var(--color-error)">A</div></div></header><div class="page"><h1 class="page-title" style="margin-bottom:24px">Platform Overview</h1><div class="grid-4" style="margin-bottom:24px"><div class="stat-card"><div class="stat-label">Total Users</div><div class="stat-value">1,247</div><div class="stat-change positive">+89 this week</div></div><div class="stat-card"><div class="stat-label">Active Projects</div><div class="stat-value">3,892</div><div class="stat-change positive">+234 this week</div></div><div class="stat-card"><div class="stat-label">Revenue (MTD)</div><div class="stat-value">$12.4K</div><div class="stat-change positive">+$2.1K vs last month</div></div><div class="stat-card"><div class="stat-label">Storage Used</div><div class="stat-value">2.1 TB</div><div class="stat-change">of 5 TB allocated</div></div></div><div class="grid-2" style="gap:20px"><div class="card"><div class="card-header"><span class="card-title">Recent Signups</span></div><div class="card-body" style="padding:0"><table class="table"><thead><tr><th>User</th><th>Plan</th><th>Joined</th></tr></thead><tbody><tr><td style="font-weight:600">@newproducer</td><td><span class="badge badge-muted" style="font-size:9px">Free</span></td><td style="color:var(--text-muted)">2h ago</td></tr><tr><td style="font-weight:600">@studiox</td><td><span class="badge badge-purple" style="font-size:9px">Pro</span></td><td style="color:var(--text-muted)">5h ago</td></tr><tr><td style="font-weight:600">@beatking</td><td><span class="badge badge-muted" style="font-size:9px">Free</span></td><td style="color:var(--text-muted)">1d ago</td></tr></tbody></table></div></div><div class="card"><div class="card-header"><span class="card-title">System Health</span><span class="badge badge-success">Healthy</span></div><div class="card-body"><div style="display:flex;flex-direction:column;gap:10px;font-size:12px"><div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">API Latency (p95)</span><span style="font-weight:600;color:var(--color-success)">42ms</span></div><div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">Error Rate</span><span style="font-weight:600;color:var(--color-success)">0.02%</span></div><div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">Uptime (30d)</span><span style="font-weight:600">99.97%</span></div><div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">Active Jobs</span><span style="font-weight:600">12</span></div></div></div></div></div></div></div></div></body></html>
    </div>
  </foreignObject>
