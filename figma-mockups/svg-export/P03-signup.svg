<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 929" 
     width="1440" 
     height="929">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — Sign Up</title><link rel="stylesheet" href="design-system/shared.css"><style>body{display:flex;align-items:center;justify-content:center;min-height:100vh}.login-bg{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(139,92,246,0.08) 0%,transparent 60%),radial-gradient(ellipse at 70% 50%,rgba(6,182,212,0.05) 0%,transparent 60%),var(--bg-primary)}.login-card{position:relative;z-index:1;width:420px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-xl);padding:40px}.login-logo{text-align:center;margin-bottom:28px}.login-logo .icon{width:48px;height:48px;background:var(--brand-gradient);border-radius:var(--radius-lg);display:inline-flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:white;margin-bottom:14px}.login-logo h1{font-size:22px;font-weight:800}.login-logo p{font-size:13px;color:var(--text-secondary);margin-top:4px}.auth-tabs{display:flex;background:var(--bg-primary);border-radius:var(--radius-sm);padding:3px;margin-bottom:24px}.auth-tab{flex:1;text-align:center;padding:8px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer}.auth-tab.active{background:var(--bg-surface);color:var(--text-primary)}.login-form{display:flex;flex-direction:column;gap:14px}.login-divider{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text-muted);margin:4px 0}.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border-default)}.social-buttons{display:flex;flex-direction:column;gap:8px}.social-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--bg-primary);color:var(--text-secondary);font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s}.social-btn:hover{border-color:var(--border-hover);color:var(--text-primary)}.social-btn.wallet{border-color:#F6851B;color:#F6851B}.login-footer{text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted)}.login-footer a{color:var(--brand-primary);text-decoration:none;font-weight:500}.terms{font-size:11px;color:var(--text-muted);text-align:center;margin-top:12px;line-height:1.5}.terms a{color:var(--text-secondary);text-decoration:underline}.strength-bar{height:4px;border-radius:2px;background:var(--border-default);margin-top:4px}.strength-fill{height:100%;border-radius:2px;width:60%}.checklist{font-size:11px;color:var(--text-muted);margin-top:6px;display:flex;flex-direction:column;gap:2px}.checklist .pass{color:var(--color-success)}.checklist .fail{color:var(--text-muted)}</style></head><body><div class="login-bg"></div><div class="login-card"><div class="login-logo"><div class="icon">S</div><h1>SoundHub</h1><p>Create your account and start making music</p></div><div class="auth-tabs"><div class="auth-tab">Sign In</div><div class="auth-tab active">Sign Up</div></div><form class="login-form"><div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" placeholder="you@example.com"></div><div class="form-group"><label class="form-label">Username</label><input class="form-input" placeholder="Choose a username"></div><div class="form-group"><label class="form-label">Password</label><input class="form-input" type="password" placeholder="Min 8 characters"><div class="strength-bar"><div class="strength-fill" style="background:var(--color-warning)"></div></div><div class="checklist"><span class="pass">✓ At least 8 characters</span><span class="pass">✓ Contains a number</span><span class="fail">○ Contains uppercase letter</span></div></div><div class="form-group"><label class="form-label">Confirm Password</label><input class="form-input" type="password" placeholder="Repeat password"></div><button class="btn btn-primary btn-lg" style="width:100%;justify-content:center">Create Account</button></form><div class="login-divider">or continue with</div><div class="social-buttons"><div class="social-btn wallet">🦊 Sign up with Wallet</div><div class="social-btn">🔗 Sign up with Discord</div></div><div class="login-footer">Already have an account? <a href="#">Sign in</a></div><div class="terms">By creating an account you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></div></div></body></html>
    </div>
  </foreignObject>
</svg>