<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — Email Preferences</title><link rel="stylesheet" href="design-system/shared.css"></head><body><div class="app-layout"><aside class="sidebar"><div class="sidebar-logo"><div class="logo-icon">S</div><div class="logo-text">SoundHub</div></div><nav class="sidebar-nav"><div class="sidebar-section-label">Main</div><a class="sidebar-item" href="#"><span class="icon">📊</span> Dashboard</a><div class="sidebar-section-label">Account</div><a class="sidebar-item active" href="#"><span class="icon">⚙️</span> Settings</a></nav><div class="sidebar-footer"><a class="sidebar-item" href="#"><span class="icon">❓</span> Help</a></div></aside><div class="main-content"><header class="topbar"><div style="font-size:14px;font-weight:600">Settings</div><div class="topbar-right"><div class="topbar-avatar">P</div></div></header><div class="page"><h1 class="page-title" style="margin-bottom:24px">Email Preferences</h1><div class="settings-section"><div class="settings-section-header"><div class="settings-section-title">Email Notifications</div><div class="settings-section-desc">Choose which emails you receive</div></div><div class="settings-section-body"><div class="settings-row"><div><div class="settings-row-label">Review activity</div><div class="settings-row-desc">Comments, approvals, and change requests</div></div><div class="toggle on"></div></div><div class="settings-row"><div><div class="settings-row-label">Version uploads</div><div class="settings-row-desc">When someone uploads a new version</div></div><div class="toggle on"></div></div><div class="settings-row"><div><div class="settings-row-label">Processing complete</div><div class="settings-row-desc">When your upload processing finishes</div></div><div class="toggle on"></div></div><div class="settings-row"><div><div class="settings-row-label">Marketplace sales</div><div class="settings-row-desc">When someone purchases your asset</div></div><div class="toggle on"></div></div><div class="settings-row"><div><div class="settings-row-label">Weekly digest</div><div class="settings-row-desc">Summary of your activity and stats</div></div><div class="toggle"></div></div><div class="settings-row"><div><div class="settings-row-label">Product updates</div><div class="settings-row-desc">New features and improvements</div></div><div class="toggle"></div></div><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn btn-primary">Save preferences</button></div></div></div></div></div></div></body></html>
