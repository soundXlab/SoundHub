<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — System Health</title><link rel="stylesheet" href="design-system/shared.css"></head><body><div class="app-layout"><aside class="sidebar" style="background:#0f0f11"><div class="sidebar-logo"><div class="logo-icon" style="background:var(--color-error)">A</div><div class="logo-text">Admin</div></div><nav class="sidebar-nav"><div class="sidebar-section-label">Platform</div><a class="sidebar-item" href="#"><span class="icon">📊</span> Dashboard</a><a class="sidebar-item" href="#"><span class="icon">👥</span> Users</a><a class="sidebar-item" href="#"><span class="icon">📦</span> Content</a><a class="sidebar-item" href="#"><span class="icon">💰</span> Revenue</a><a class="sidebar-item active" href="#"><span class="icon">🔧</span> System</a></nav><div class="sidebar-footer"><a class="sidebar-item" href="#"><span class="icon">←</span> Back to app</a></div></aside><div class="main-content"><header class="topbar"><div style="font-size:14px;font-weight:600">System Health <span style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;background:rgba(239,68,68,0.12);color:var(--color-error);margin-left:8px">ADMIN</span></div><div class="topbar-right"><div class="topbar-avatar" style="background:var(--color-error)">A</div></div></header><div class="page"><h1 class="page-title" style="margin-bottom:24px">System Health</h1><div class="grid-4" style="margin-bottom:24px"><div class="stat-card"><div class="stat-label">Uptime (30d)</div><div class="stat-value" style="color:var(--color-success)">99.97%</div></div><div class="stat-card"><div class="stat-label">API Latency (p95)</div><div class="stat-value">42ms</div></div><div class="stat-card"><div class="stat-label">Error Rate</div><div class="stat-value" style="color:var(--color-success)">0.02%</div></div><div class="stat-card"><div class="stat-label">Active Jobs</div><div class="stat-value">12</div></div></div><div class="card" style="margin-bottom:20px"><div class="card-header"><span class="card-title">Service Status</span><span class="badge badge-success">All Systems Operational</span></div><div class="card-body" style="padding:0"><table class="table"><thead><tr><th>Service</th><th>Status</th><th>Latency</th><th>Uptime</th></tr></thead><tbody><tr><td style="font-weight:600">API Server</td><td><span class="badge badge-success" style="font-size:9px">Operational</span></td><td style="font-family:var(--font-mono)">42ms</td><td>99.99%</td></tr><tr><td style="font-weight:600">Job Queue</td><td><span class="badge badge-success" style="font-size:9px">Operational</span></td><td style="font-family:var(--font-mono)">18ms</td><td>99.98%</td></tr><tr><td style="font-weight:600">Storage (GCS)</td><td><span class="badge badge-success" style="font-size:9px">Operational</span></td><td style="font-family:var(--font-mono">85ms</td><td>99.95%</td></tr><tr><td style="font-weight:600">Database</td><td><span class="badge badge-success" style="font-size:9px">Operational</span></td><td style="font-family:var(--font-mono)">12ms</td><td>99.99%</td></tr><tr><td style="font-weight:600">CDN</td><td><span class="badge badge-success" style="font-size:9px">Operational</span></td><td style="font-family:var(--font-mono)">8ms</td><td>100%</td></tr></tbody></table></div></div></div></div></div></body></html>
