<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 900" 
     width="1440" 
     height="900">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — Reset Password</title><link rel="stylesheet" href="design-system/shared.css"><style>body{display:flex;align-items:center;justify-content:center;min-height:100vh}.login-bg{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(139,92,246,0.08) 0%,transparent 60%),var(--bg-primary)}.login-card{position:relative;z-index:1;width:400px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-xl);padding:40px;text-align:center}.login-logo .icon{width:48px;height:48px;background:var(--brand-gradient);border-radius:var(--radius-lg);display:inline-flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:white;margin-bottom:16px}h1{font-size:22px;font-weight:800;margin-bottom:8px}.desc{font-size:13px;color:var(--text-secondary);margin-bottom:24px;line-height:1.5}.success-msg{padding:16px;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);border-radius:var(--radius-md);font-size:13px;color:var(--color-success);margin-bottom:16px}</style></head><body><div class="login-bg"></div><div class="login-card"><div class="login-logo"><div class="icon">S</div></div><h1>Reset Password</h1><p class="desc">Enter your email address and we'll send you a link to reset your password.</p><form style="display:flex;flex-direction:column;gap:14px;text-align:left"><div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" placeholder="you@example.com"></div><button class="btn btn-primary btn-lg" style="width:100%;justify-content:center">Send Reset Link</button></form><div style="margin-top:20px;font-size:13px;color:var(--text-muted)">Remember your password? <a href="#" style="color:var(--brand-primary);text-decoration:none">Sign in</a></div></div></body></html>
    </div>
  </foreignObject>
</svg>