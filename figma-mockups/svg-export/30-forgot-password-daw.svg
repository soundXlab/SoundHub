<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 900" 
     width="1440" 
     height="900">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>SoundHub — Forgot Password (DAW Style)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif; background: #0d0d0d;
      color: #e4e4e7; overflow: hidden; height: 100vh;
      display: flex; flex-direction: column;
    }

    /* ── Transport Bar ── */
    .transport-bar {
      height: 40px; background: #111113; border-bottom: 1px solid #27272a;
      display: flex; align-items: center; padding: 0 12px; gap: 16px;
      font-size: 11px; user-select: none;
    }
    .transport-logo { font-weight: 800; font-size: 13px; color: #ea5808; letter-spacing: -0.5px; }
    .transport-logo span { color: #e4e4e7; }
    .transport-divider { width: 1px; height: 20px; background: #27272a; }
    .transport-spacer { flex: 1; }
    .transport-time {
      font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700;
      color: #e4e4e7; letter-spacing: 1px;
    }

    /* ── Main Layout ── */
    .forgot-layout { flex: 1; display: flex; overflow: hidden; }

    /* ── Left Panel — Hero ── */
    .hero-panel {
      flex: 1; background: linear-gradient(135deg, #0d0d0d 0%, #1a1025 50%, #0d0d0d 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    .hero-panel::before {
      content: ''; position: absolute; width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(234,88,8,0.15) 0%, transparent 70%);
      top: 50%; left: 50%; transform: translate(-50%, -50%);
    }
    .hero-content { position: relative; z-index: 1; text-align: center; max-width: 400px; }

    /* ── Waveform Visualizer ── */
    .waveform-visualizer {
      display: flex; align-items: center; justify-content: center;
      gap: 4px; height: 120px; margin-bottom: 40px;
    }
    .viz-bar { width: 4px; border-radius: 2px; }
    .hero-logo {
      font-size: 48px; font-weight: 800; color: #ea5808;
      margin-bottom: 8px; letter-spacing: -2px;
    }
    .hero-logo span { color: #e4e4e7; }
    .hero-tagline {
      font-size: 16px; color: #a1a1aa; line-height: 1.5; margin-bottom: 32px;
    }
    .hero-features { display: flex; gap: 24px; justify-content: center; }
    .hero-feature {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: #71717a;
    }
    .hero-feature .icon { font-size: 16px; }

    /* ── Right Panel — Form ── */
    .form-panel {
      width: 480px; background: #111113; border-left: 1px solid #27272a;
      display: flex; flex-direction: column; justify-content: center;
      padding: 48px 40px; overflow-y: auto;
    }
    .form-header { margin-bottom: 32px; }
    .form-title { font-size: 24px; font-weight: 700; color: #e4e4e7; }
    .form-subtitle { font-size: 13px; color: #71717a; margin-top: 8px; line-height: 1.5; }

    /* ── Form Elements ── */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 600; color: #a1a1aa;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%; background: #0d0d0d; border: 1px solid #27272a;
      border-radius: 6px; padding: 10px 12px; font-size: 13px;
      color: #e4e4e7; outline: none; transition: border-color 0.15s;
    }
    .form-input:focus { border-color: #ea5808; }
    .form-input::placeholder { color: #52525b; }
    .form-input-icon {
      position: relative;
    }
    .form-input-icon .form-input { padding-left: 36px; }
    .form-input-icon .icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      font-size: 14px; color: #52525b;
    }
    .form-hint { font-size: 11px; color: #52525b; margin-top: 4px; }

    /* ── Buttons ── */
    .btn {
      width: 100%; padding: 10px 16px; border-radius: 6px; font-size: 13px;
      font-weight: 600; cursor: pointer; border: 1px solid #27272a;
      transition: all 0.15s; display: flex; align-items: center;
      justify-content: center; gap: 8px;
    }
    .btn-primary { background: #ea5808; color: #fff; border-color: #ea5808; }
    .btn-primary:hover { background: #c2410c; }
    .btn-secondary { background: #0d0d0d; color: #e4e4e7; border-color: #27272a; }
    .btn-secondary:hover { background: #1a1a1a; }

    /* ── Divider ── */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; font-size: 11px; color: #52525b;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #27272a;
    }

    /* ── Info Box ── */
    .info-box {
      display: flex; gap: 12px; padding: 14px;
      background: rgba(234,88,8,0.06); border: 1px solid rgba(234,88,8,0.2);
      border-radius: 8px; margin-bottom: 24px;
    }
    .info-icon { font-size: 20px; flex-shrink: 0; }
    .info-text { font-size: 12px; color: #a1a1aa; line-height: 1.5; }
    .info-text strong { color: #e4e4e7; }

    /* ── Success State ── */
    .success-box {
      display: flex; flex-direction: column; align-items: center;
      padding: 32px; background: #0d0d0d; border: 1px solid #27272a;
      border-radius: 8px; text-align: center;
    }
    .success-icon { font-size: 48px; margin-bottom: 16px; }
    .success-title { font-size: 16px; font-weight: 700; color: #e4e4e7; margin-bottom: 8px; }
    .success-text { font-size: 12px; color: #71717a; line-height: 1.5; }
    .success-email {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; background: rgba(234,88,8,0.1); border: 1px solid rgba(234,88,8,0.3);
      border-radius: 4px; font-size: 12px; color: #ea5808; font-family: 'JetBrains Mono', monospace;
      margin-top: 12px;
    }

    /* ── Footer ── */
    .form-footer {
      margin-top: 24px; text-align: center; font-size: 11px; color: #52525b;
    }
    .form-footer a { color: #ea5808; text-decoration: none; }
    .form-footer a:hover { text-decoration: underline; }

    /* ── Steps ── */
    .steps {
      display: flex; gap: 8px; margin-bottom: 24px;
    }
    .step {
      flex: 1; padding: 10px; background: #0d0d0d; border: 1px solid #27272a;
      border-radius: 6px; text-align: center;
    }
    .step.active { border-color: #ea5808; background: rgba(234,88,8,0.04); }
    .step.done { border-color: #22c55e; }
    .step-number {
      width: 24px; height: 24px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; margin-bottom: 6px;
    }
    .step-number.pending { background: #1a1a1a; color: #52525b; }
    .step-number.active { background: #ea5808; color: #fff; }
    .step-number.done { background: #22c55e; color: #fff; }
    .step-title { font-size: 10px; font-weight: 600; color: #a1a1aa; }
    .step.active .step-title { color: #e4e4e7; }

    /* ── Device Chain (Bottom) ── */
    .device-chain {
      height: 48px; background: #111113; border-top: 1px solid #27272a;
      display: flex; align-items: center; padding: 0 16px; gap: 8px;
      font-size: 10px;
    }
    .device {
      padding: 4px 10px; background: #0d0d0d; border: 1px solid #27272a;
      border-radius: 4px; color: #a1a1aa;
      display: flex; align-items: center; gap: 6px;
    }
    .device .led { width: 6px; height: 6px; border-radius: 50%; background: #27272a; }
    .device.active .led { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.5); }
    .device-chain-spacer { flex: 1; }
    .device-chain-label {
      font-size: 9px; color: #52525b; text-transform: uppercase;
      letter-spacing: 0.5px; font-weight: 700;
    }
  </style>
</head>
<body>
  <!-- Transport Bar -->
  <div class="transport-bar">
    <div class="transport-logo">Sound<span>Hub</span></div>
    <div class="transport-divider"></div>
    <div class="transport-spacer"></div>
    <div class="transport-time">RESET PASSWORD</div>
    <div class="transport-spacer"></div>
    <div class="transport-divider"></div>
    <a style="font-size:11px;color:#71717a;cursor:pointer">Help</a>
    <a style="font-size:11px;color:#71717a;cursor:pointer">Support</a>
  </div>

  <!-- Main -->
  <div class="forgot-layout">
    <!-- Left Panel — Hero -->
    <div class="hero-panel">
      <div class="hero-content">
        <!-- Waveform Visualizer -->
        <div class="waveform-visualizer">
          <div class="viz-bar" style="height:20px;background:#ea5808;opacity:0.4"></div>
          <div class="viz-bar" style="height:35px;background:#ea5808;opacity:0.5"></div>
          <div class="viz-bar" style="height:50px;background:#ea5808;opacity:0.6"></div>
          <div class="viz-bar" style="height:65px;background:#ea5808;opacity:0.7"></div>
          <div class="viz-bar" style="height:80px;background:#ea5808;opacity:0.8"></div>
          <div class="viz-bar" style="height:95px;background:#ea5808;opacity:0.9"></div>
          <div class="viz-bar" style="height:110px;background:#ea5808"></div>
          <div class="viz-bar" style="height:95px;background:#ea5808;opacity:0.9"></div>
          <div class="viz-bar" style="height:80px;background:#ea5808;opacity:0.8"></div>
          <div class="viz-bar" style="height:65px;background:#ea5808;opacity:0.7"></div>
          <div class="viz-bar" style="height:50px;background:#ea5808;opacity:0.6"></div>
          <div class="viz-bar" style="height:35px;background:#ea5808;opacity:0.5"></div>
          <div class="viz-bar" style="height:20px;background:#ea5808;opacity:0.4"></div>
          <div class="viz-bar" style="height:10px;background:#ea5808;opacity:0.3"></div>
          <div class="viz-bar" style="height:25px;background:#ea5808;opacity:0.4"></div>
          <div class="viz-bar" style="height:40px;background:#ea5808;opacity:0.5"></div>
          <div class="viz-bar" style="height:55px;background:#ea5808;opacity:0.6"></div>
          <div class="viz-bar" style="height:70px;background:#ea5808;opacity:0.7"></div>
          <div class="viz-bar" style="height:85px;background:#ea5808;opacity:0.8"></div>
          <div class="viz-bar" style="height:100px;background:#ea5808;opacity:0.9"></div>
          <div class="viz-bar" style="height:110px;background:#ea5808"></div>
          <div class="viz-bar" style="height:95px;background:#ea5808;opacity:0.9"></div>
          <div class="viz-bar" style="height:80px;background:#ea5808;opacity:0.8"></div>
          <div class="viz-bar" style="height:65px;background:#ea5808;opacity:0.7"></div>
          <div class="viz-bar" style="height:50px;background:#ea5808;opacity:0.6"></div>
          <div class="viz-bar" style="height:35px;background:#ea5808;opacity:0.5"></div>
          <div class="viz-bar" style="height:20px;background:#ea5808;opacity:0.4"></div>
          <div class="viz-bar" style="height:10px;background:#ea5808;opacity:0.3"></div>
          <div class="viz-bar" style="height:30px;background:#ea5808;opacity:0.4"></div>
          <div class="viz-bar" style="height:45px;background:#ea5808;opacity:0.5"></div>
          <div class="viz-bar" style="height:60px;background:#ea5808;opacity:0.6"></div>
          <div class="viz-bar" style="height:75px;background:#ea5808;opacity:0.7"></div>
          <div class="viz-bar" style="height:90px;background:#ea5808;opacity:0.8"></div>
          <div class="viz-bar" style="height:105px;background:#ea5808;opacity:0.9"></div>
          <div class="viz-bar" style="height:90px;background:#ea5808;opacity:0.8"></div>
          <div class="viz-bar" style="height:75px;background:#ea5808;opacity:0.7"></div>
          <div class="viz-bar" style="height:60px;background:#ea5808;opacity:0.6"></div>
          <div class="viz-bar" style="height:45px;background:#ea5808;opacity:0.5"></div>
          <div class="viz-bar" style="height:30px;background:#ea5808;opacity:0.4"></div>
          <div class="viz-bar" style="height:15px;background:#ea5808;opacity:0.3"></div>
        </div>

        <div class="hero-logo">Sound<span>Hub</span></div>
        <div class="hero-tagline">
          Don't worry, it happens to the best of us.<br>
          We'll get you back to creating in no time.
        </div>
        <div class="hero-features">
          <div class="hero-feature"><span class="icon">🔒</span> Secure</div>
          <div class="hero-feature"><span class="icon">⚡</span> Fast</div>
          <div class="hero-feature"><span class="icon">📧</span> Email</div>
        </div>
      </div>
    </div>

    <!-- Right Panel — Form -->
    <div class="form-panel">
      <div class="form-header">
        <div class="form-title">Reset your password</div>
        <div class="form-subtitle">Enter your email address and we'll send you a link to reset your password.</div>
      </div>

      <!-- Steps -->
      <div class="steps">
        <div class="step active">
          <div class="step-number active">1</div>
          <div class="step-title">Enter Email</div>
        </div>
        <div class="step">
          <div class="step-number pending">2</div>
          <div class="step-title">Check Inbox</div>
        </div>
        <div class="step">
          <div class="step-number pending">3</div>
          <div class="step-title">New Password</div>
        </div>
      </div>

      <!-- Info Box -->
      <div class="info-box">
        <div class="info-icon">💡</div>
        <div class="info-text">
          <strong>Tip:</strong> Check your spam folder if you don't see the email within a few minutes. The reset link expires in 24 hours.
        </div>
      </div>

      <!-- Email Form -->
      <form>
        <div class="form-group">
          <label class="form-label">Email address</label>
          <div class="form-input-icon">
            <span class="icon">📧</span>
            <input class="form-input" type="email" placeholder="you@example.com">
          </div>
          <div class="form-hint">We'll send the reset link to this email</div>
        </div>

        <button class="btn btn-primary" type="submit">Send Reset Link</button>
      </form>

      <div class="divider">or</div>

      <button class="btn btn-secondary">← Back to Sign In</button>

      <div class="form-footer">
        Need help? <a>Contact Support</a>
        <div style="margin-top:12px;color:#3f3f46">
          <a>Terms</a> · <a>Privacy</a> · <a>Status</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Device Chain -->
  <div class="device-chain">
    <span class="device-chain-label">Status:</span>
    <div class="device active"><div class="led"></div> API: Online</div>
    <div class="device"><div class="led"></div> Email Service: Ready</div>
    <div class="device"><div class="led"></div> Rate Limit: OK</div>
    <div class="device-chain-spacer"></div>
    <span class="device-chain-label">Security:</span>
    <div class="device active"><div class="led"></div> TLS 1.3</div>
  </div>

</body></html>
    </div>
  </foreignObject>
</svg>