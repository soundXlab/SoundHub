<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 900" 
     width="1440" 
     height="900">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — Maintenance</title><link rel="stylesheet" href="design-system/shared.css"><style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg-primary)}.maintenance{text-align:center;max-width:480px;padding:40px}.maintenance .icon{font-size:64px;margin-bottom:24px;opacity:0.3}.maintenance h1{font-size:28px;font-weight:800;margin-bottom:12px;letter-spacing:-0.3px}.maintenance p{font-size:14px;color:var(--text-secondary);line-height:1.6;margin-bottom:24px}.maintenance .time{font-family:var(--font-mono);font-size:13px;color:var(--brand-primary);padding:8px 16px;background:rgba(139,92,246,0.1);border-radius:var(--radius-sm);display:inline-block;margin-bottom:24px}</style></head><body><div class="maintenance"><div class="icon">🔧</div><h1>Scheduled Maintenance</h1><p>We're upgrading our infrastructure to serve you better. The platform will be back online shortly.</p><div class="time">Estimated completion: 30 minutes</div><p style="font-size:12px;color:var(--text-muted)">Follow us on Twitter for updates: <span style="color:var(--brand-primary)">@soundhub_io</span></p></div></body></html>
    </div>
  </foreignObject>
</svg>