<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 900" 
     width="1440" 
     height="900">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — Careers</title><link rel="stylesheet" href="design-system/shared.css"><style>nav.pricing-nav{display:flex;align-items:center;gap:24px;padding:16px 40px;border-bottom:1px solid var(--border-default);width:100%}.careers-hero{text-align:center;padding:80px 40px;max-width:640px;margin:0 auto}.careers-hero h1{font-size:40px;font-weight:800;letter-spacing:-0.5px;margin-bottom:12px}.careers-hero p{font-size:16px;color:var(--text-secondary);line-height:1.7}.jobs{max-width:800px;margin:0 auto;padding:0 40px 80px}.job-card{display:flex;align-items:center;gap:16px;padding:20px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg);margin-bottom:12px;cursor:pointer;transition:border-color 0.15s}.job-card:hover{border-color:var(--border-hover)}.job-info{flex:1}.job-title{font-size:15px;font-weight:700;margin-bottom:4px}.job-meta{font-size:12px;color:var(--text-muted)}.job-tags{display:flex;gap:6px;margin-top:8px}</style></head><body><nav class="pricing-nav"><span style="font-size:18px;font-weight:800;color:var(--brand-accent)">🎵 SoundHub</span><span style="flex:1"></span><a href="#" style="font-size:13px;color:var(--text-secondary);text-decoration:none">Features</a><a href="#" style="font-size:13px;color:var(--text-secondary);text-decoration:none">Docs</a><a href="#" style="font-size:13px;color:var(--text-secondary);text-decoration:none">About</a><a href="#" style="font-size:13px;color:var(--text-secondary);text-decoration:none">Sign in</a><button class="btn btn-primary btn-sm">Get Started</button></nav><div class="careers-hero"><h1>Join our team</h1><p>We're building the future of music collaboration. If you're passionate about audio, design, or engineering — we want to hear from you.</p></div><div class="jobs"><div class="job-card"><div style="font-size:24px">🎹</div><div class="job-info"><div class="job-title">Senior Audio Engineer</div><div class="job-meta">Full-time · Remote · $120K-$160K</div><div class="job-tags"><span class="badge badge-purple" style="font-size:9px">Audio</span><span class="badge badge-muted" style="font-size:9px">Engineering</span></div></div><span style="color:var(--text-muted)">→</span></div><div class="job-card"><div style="font-size:24px">🎨</div><div class="job-info"><div class="job-title">Product Designer</div><div class="job-meta">Full-time · Remote · $100K-$140K</div><div class="job-tags"><span class="badge badge-purple" style="font-size:9px">Design</span><span class="badge badge-muted" style="font-size:9px">Figma</span></div></div><span style="color:var(--text-muted)">→</span></div><div class="job-card"><div style="font-size:24px">💻</div><div class="job-info"><div class="job-title">Full-Stack Engineer</div><div class="job-meta">Full-time · Remote · $130K-$170K</div><div class="job-tags"><span class="badge badge-purple" style="font-size:9px">TypeScript</span><span class="badge badge-muted" style="font-size:9px">Python</span><span class="badge badge-muted" style="font-size:9px">React</span></div></div><span style="color:var(--text-muted)">→</span></div></div></body></html>
    </div>
  </foreignObject>
</svg>