<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 900" 
     width="1440" 
     height="900">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — Payouts</title><link rel="stylesheet" href="design-system/shared.css"><style>.balance-card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-xl);padding:32px;text-align:center;margin-bottom:24px}.balance-amount{font-size:48px;font-weight:800;letter-spacing:-1px;margin-bottom:4px}.balance-label{font-size:13px;color:var(--text-secondary)}.payout-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--border-default);font-size:13px}.payout-row:last-child{border-bottom:none}</style></head><body><div class="app-layout"><aside class="sidebar"><div class="sidebar-logo"><div class="logo-icon">S</div><div class="logo-text">SoundHub</div></div><nav class="sidebar-nav"><div class="sidebar-section-label">Main</div><a class="sidebar-item" href="#"><span class="icon">📊</span> Dashboard</a><a class="sidebar-item active" href="#"><span class="icon">🛒</span> Marketplace</a><div class="sidebar-section-label">Workspace</div><a class="sidebar-item" href="#"><span class="icon">💬</span> Reviews</a><div class="sidebar-section-label">Account</div><a class="sidebar-item" href="#"><span class="icon">⚙️</span> Settings</a></nav><div class="sidebar-footer"><a class="sidebar-item" href="#"><span class="icon">❓</span> Help</a></div></aside><div class="main-content"><header class="topbar"><div style="font-size:14px;font-weight:600">Payouts</div><div class="topbar-right"><div class="topbar-avatar">P</div></div></header><div class="page"><h1 class="page-title" style="margin-bottom:24px">Payouts</h1><div class="balance-card"><div class="balance-amount" style="color:var(--color-success)">$247.20</div><div class="balance-label">Available balance</div><div style="display:flex;justify-content:center;gap:12px;margin-top:16px"><button class="btn btn-primary">Withdraw to Wallet</button><button class="btn btn-secondary">Withdraw to Bank</button></div></div><div class="grid-3" style="margin-bottom:24px"><div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value">$32.40</div></div><div class="stat-card"><div class="stat-label">Paid Out</div><div class="stat-value">$567.60</div></div><div class="stat-card"><div class="stat-label">Next Payout</div><div class="stat-value" style="font-size:18px">Sep 1</div></div></div><div class="card"><div class="card-header"><span class="card-title">Payout History</span></div><div class="card-body" style="padding:0"><div class="payout-row"><span style="font-size:11px;color:var(--text-muted);min-width:100px">Aug 15, 2026</span><span style="flex:1;font-weight:500">Withdrawal to MetaMask</span><span style="color:var(--color-success);font-weight:600">-$124.00</span><span class="badge badge-success" style="font-size:9px">Completed</span></div><div class="payout-row"><span style="font-size:11px;color:var(--text-muted);min-width:100px">Aug 1, 2026</span><span style="flex:1;font-weight:500">Sales revenue</span><span style="color:var(--color-success);font-weight:600">+$87.60</span><span class="badge badge-success" style="font-size:9px">Completed</span></div><div class="payout-row"><span style="font-size:11px;color:var(--text-muted);min-width:100px">Jul 15, 2026</span><span style="flex:1;font-weight:500">Withdrawal to MetaMask</span><span style="color:var(--color-success);font-weight:600">-$200.00</span><span class="badge badge-success" style="font-size:9px">Completed</span></div><div class="payout-row"><span style="font-size:11px;color:var(--text-muted);min-width:100px">Jul 1, 2026</span><span style="flex:1;font-weight:500">Sales revenue</span><span style="color:var(--color-success);font-weight:600">+$155.60</span><span class="badge badge-success" style="font-size:9px">Completed</span></div></div></div></div></div></div></body></html>
    </div>
  </foreignObject>
</svg>