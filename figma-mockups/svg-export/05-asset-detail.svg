<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 1181" 
     width="1440" 
     height="1181">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>SoundHub — Asset Detail</title>
  <link rel="stylesheet" href="design-system/shared.css">
  <style>
    .asset-detail-layout { display: grid; grid-template-columns: 1fr 360px; gap: 24px; }
    .asset-hero { background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-lg); overflow: hidden; }
    .asset-hero-waveform { height: 200px; background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(6,182,212,0.08)); display: flex; align-items: center; justify-content: center; position: relative; }
    .asset-hero-body { padding: 24px; }
    .asset-hero-title { font-size: 24px; font-weight: 800; letter-spacing: -0.3px; }
    .asset-hero-meta { display: flex; align-items: center; gap: 12px; margin-top: 8px; font-size: 13px; color: var(--text-secondary); }
    .asset-hero-tags { display: flex; gap: 6px; margin-top: 12px; }
    .asset-sidebar-card { background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-lg); margin-bottom: 16px; }
    .asset-sidebar-body { padding: 20px; }
    .price-block { text-align: center; padding: 24px 20px; background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-lg); margin-bottom: 16px; }
    .price-big { font-size: 36px; font-weight: 800; color: var(--brand-accent); }
    .price-big.free { color: var(--color-success); }
    .file-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-default); font-size: 13px; }
    .file-row:last-child { border-bottom: none; }
    .spectrum-bar { display: flex; align-items: end; gap: 2px; height: 120px; padding: 0 24px 0; }
    .sb { flex: 1; border-radius: 1px; opacity: 0.6; }
    .review-mini { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-default); }
    .review-mini:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo"><div class="logo-icon">S</div><div class="logo-text">SoundHub</div></div>
      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Main</div>
        <a class="sidebar-item" href="#"><span class="icon">📊</span> Dashboard</a>
        <a class="sidebar-item" href="#"><span class="icon">📁</span> Projects</a>
        <a class="sidebar-item active" href="#"><span class="icon">🛒</span> Marketplace</a>
        <div class="sidebar-section-label">Workspace</div>
        <a class="sidebar-item" href="#"><span class="icon">💬</span> Reviews</a>
        <div class="sidebar-section-label">Account</div>
        <a class="sidebar-item" href="#"><span class="icon">⚙️</span> Settings</a>
      </nav>
      <div class="sidebar-footer"><a class="sidebar-item" href="#"><span class="icon">❓</span> Help</a></div>
    </aside>
    <div class="main-content">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <a href="#" style="color:var(--text-muted);text-decoration:none;font-size:13px">← Marketplace</a>
          <span style="color:var(--text-muted)">/</span>
          <span style="font-size:14px;font-weight:600">Lo-Fi Drums Pack</span>
        </div>
        <div class="topbar-right"><div class="topbar-icon-btn">🔔</div><div class="topbar-avatar">P</div></div>
      </header>
      <div class="page">
        <div class="asset-detail-layout">
          <div>
            <!-- Hero Player -->
            <div class="asset-hero" style="margin-bottom:20px">
              <div class="asset-hero-waveform">
                <div class="spectrum-bar" style="width:100%">
                  <script>document.currentScript.insertAdjacentHTML('afterend','</div>')</script>
                </div>
              </div>
              <div style="padding:16px 24px;border-top:1px solid var(--border-default)">
                <div class="waveform-controls">
                  <div class="waveform-play-btn">▶</div>
                  <span class="waveform-time">0:00</span>
                  <div class="waveform-progress"><div class="waveform-progress-fill" style="width:0%"></div></div>
                  <span class="waveform-time">2:34</span>
                  <div style="display:flex;align-items:center;gap:4px;margin-left:8px">
                    <span style="font-size:12px">🔊</span>
                    <div style="width:60px;height:4px;background:var(--border-default);border-radius:2px;position:relative">
                      <div style="position:absolute;left:0;top:0;bottom:0;width:70%;background:var(--text-secondary);border-radius:2px"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Asset Info -->
            <div class="asset-hero">
              <div class="asset-hero-body">
                <div class="asset-hero-title">Lo-Fi Drums Pack</div>
                <div class="asset-hero-meta">
                  <span>by <strong style="color:var(--text-primary)">@producer1</strong></span>
                  <span>·</span>
                  <span>WAV · 24bit · 44.1kHz</span>
                  <span>·</span>
                  <span style="color:var(--color-warning)">★ 4.8 (124 reviews)</span>
                </div>
                <div class="asset-hero-tags">
                  <span class="badge badge-purple">lo-fi</span>
                  <span class="badge badge-muted">drums</span>
                  <span class="badge badge-muted">chill</span>
                  <span class="badge badge-muted">electronic</span>
                </div>
                <p style="font-size:13px;color:var(--text-secondary);margin-top:16px;line-height:1.6">
                  50+ lo-fi drum samples, royalty-free. Includes kicks, snares, hats, percussion loops, and one-shots. Perfect for lo-fi hip-hop, chill beats, and ambient productions. All samples are mastered to -14 LUFS with headroom for mixing.
                </p>

                <!-- Technical Details -->
                <h3 style="font-size:14px;font-weight:700;margin-top:20px;margin-bottom:12px">Technical Details</h3>
                <div class="grid-3" style="gap:8px">
                  <div style="background:var(--bg-elevated);padding:10px 14px;border-radius:var(--radius-sm)">
                    <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase">BPM</div>
                    <div style="font-size:14px;font-weight:600;font-family:var(--font-mono)">85</div>
                  </div>
                  <div style="background:var(--bg-elevated);padding:10px 14px;border-radius:var(--radius-sm)">
                    <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase">Key</div>
                    <div style="font-size:14px;font-weight:600;font-family:var(--font-mono)">Cm</div>
                  </div>
                  <div style="background:var(--bg-elevated);padding:10px 14px;border-radius:var(--radius-sm)">
                    <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase">Samples</div>
                    <div style="font-size:14px;font-weight:600;font-family:var(--font-mono)">52</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Sidebar -->
          <div>
            <!-- Price + CTA -->
            <div class="price-block">
              <div class="price-big free">Free</div>
              <p style="font-size:12px;color:var(--text-secondary);margin:8px 0 16px">Royalty-free license included</p>
              <button class="btn btn-primary btn-lg" style="width:100%;justify-content:center">Download Free</button>
              <button class="btn btn-outline" style="width:100%;justify-content:center;margin-top:8px">💾 Save to Library</button>
            </div>

            <!-- Files -->
            <div class="asset-sidebar-card">
              <div class="card-header"><span class="card-title">Files (3)</span></div>
              <div class="asset-sidebar-body">
                <div class="file-row">
                  <span>🎵</span>
                  <span style="flex:1;font-weight:500">preview.mp3</span>
                  <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px">2.1 MB</span>
                </div>
                <div class="file-row">
                  <span>🎵</span>
                  <span style="flex:1;font-weight:500">full_pack.zip</span>
                  <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px">12.4 MB</span>
                </div>
                <div class="file-row">
                  <span>📋</span>
                  <span style="flex:1;font-weight:500">license.txt</span>
                  <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px">4 KB</span>
                </div>
              </div>
            </div>

            <!-- License -->
            <div class="asset-sidebar-card">
              <div class="card-header"><span class="card-title">License</span></div>
              <div class="asset-sidebar-body">
                <div style="font-size:13px;font-weight:600;color:var(--color-success);margin-bottom:8px">✓ Royalty-Free</div>
                <ul style="font-size:12px;color:var(--text-secondary);padding-left:16px;line-height:1.8">
                  <li>Use in commercial projects</li>
                  <li>Unlimited distribution</li>
                  <li>No attribution required</li>
                  <li>Cannot redistribute as-is</li>
                </ul>
              </div>
            </div>

            <!-- Creator -->
            <div class="asset-sidebar-card">
              <div class="card-header"><span class="card-title">Creator</span></div>
              <div class="asset-sidebar-body" style="display:flex;align-items:center;gap:12px">
                <div style="width:40px;height:40px;border-radius:50%;background:var(--brand-gradient);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:white">P</div>
                <div>
                  <div style="font-size:13px;font-weight:600">@producer1</div>
                  <div style="font-size:11px;color:var(--text-muted)">48 assets · ★ 4.8 avg</div>
                </div>
                <button class="btn btn-ghost btn-sm" style="margin-left:auto">View →</button>
              </div>
            </div>

            <!-- Reviews -->
            <div class="asset-sidebar-card">
              <div class="card-header"><span class="card-title">Reviews</span></div>
              <div class="asset-sidebar-body">
                <div class="review-mini">
                  <div style="width:24px;height:24px;border-radius:50%;background:var(--brand-secondary);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:white">A</div>
                  <div style="flex:1"><div style="font-size:12px;font-weight:600">Alex <span style="color:var(--color-warning)">★★★★★</span></div><div style="font-size:11px;color:var(--text-secondary)">Great quality drums, perfect for my lo-fi project.</div></div>
                </div>
                <div class="review-mini">
                  <div style="width:24px;height:24px;border-radius:50%;background:var(--color-warning);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:white">M</div>
                  <div style="flex:1"><div style="font-size:12px;font-weight:600">Maya <span style="color:var(--color-warning)">★★★★☆</span></div><div style="font-size:11px;color:var(--text-secondary)">Solid pack, could use more percussion variety.</div></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>


</body></html>
    </div>
  </foreignObject>
</svg>