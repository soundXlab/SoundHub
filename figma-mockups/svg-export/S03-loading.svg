<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — Loading States</title><link rel="stylesheet" href="design-system/shared.css"><style>body{background:var(--bg-primary)}.mockup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;padding:40px;max-width:1440px;margin:0 auto}.mockup-frame{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-xl);overflow:hidden}.mockup-label{padding:12px 16px;background:var(--bg-elevated);border-bottom:1px solid var(--border-default);font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px}.skeleton{background:linear-gradient(90deg,var(--bg-elevated) 25%,var(--bg-hover) 50%,var(--bg-elevated) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:4px}@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}.skeleton-circle{border-radius:50%}.skeleton-page{padding:24px;height:320px;display:flex;flex-direction:column;gap:16px}.skeleton-row{display:flex;gap:12px;align-items:center}.h1.page-title{font-size:28px;font-weight:800;color:var(--text-primary);text-align:center;padding:40px 0 0;letter-spacing:-0.5px}p.page-subtitle{font-size:14px;color:var(--text-secondary);text-align:center;padding:8px 0 24px}</style></head><body><h1 class="page-title">Loading States</h1><p class="page-subtitle">Skeleton screens for every major view</p><div class="mockup-grid"><div class="mockup-frame"><div class="mockup-label">Dashboard</div><div class="skeleton-page"><div class="skeleton" style="height:24px;width:200px"></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px"><div class="skeleton" style="height:80px;border-radius:8px"></div><div class="skeleton" style="height:80px;border-radius:8px"></div><div class="skeleton" style="height:80px;border-radius:8px"></div><div class="skeleton" style="height:80px;border-radius:8px"></div></div><div class="skeleton" style="height:16px;width:120px"></div><div class="skeleton-row"><div class="skeleton skeleton-circle" style="width:40px;height:40px;flex-shrink:0"></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div class="skeleton" style="height:12px;width:60%"></div><div class="skeleton" style="height:10px;width:40%"></div></div></div><div class="skeleton-row"><div class="skeleton skeleton-circle" style="width:40px;height:40px;flex-shrink:0"></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div class="skeleton" style="height:12px;width:70%"></div><div class="skeleton" style="height:10px;width:35%"></div></div></div></div></div><div class="mockup-frame"><div class="mockup-label">Marketplace</div><div class="skeleton-page"><div class="skeleton" style="height:36px;width:100%;border-radius:6px"></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><div class="skeleton" style="height:30px;border-radius:16px"></div><div class="skeleton" style="height:30px;border-radius:16px"></div><div class="skeleton" style="height:30px;border-radius:16px"></div></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><div><div class="skeleton" style="height:80px;border-radius:8px 8px 0 0"></div><div class="skeleton" style="height:60px;border-radius:0 0 8px 8px"></div></div><div><div class="skeleton" style="height:80px;border-radius:8px 8px 0 0"></div><div class="skeleton" style="height:60px;border-radius:0 0 8px 8px"></div></div><div><div class="skeleton" style="height:80px;border-radius:8px 8px 0 0"></div><div class="skeleton" style="height:60px;border-radius:0 0 8px 8px"></div></div></div></div></div><div class="mockup-frame"><div class="mockup-label">Review Player</div><div class="skeleton-page"><div class="skeleton" style="height:20px;width:300px"></div><div class="skeleton" style="height:100px;border-radius:8px"></div><div style="display:flex;gap:12px;align-items:center"><div class="skeleton skeleton-circle" style="width:40px;height:40px;flex-shrink:0"></div><div class="skeleton" style="height:8px;flex:1;border-radius:4px"></div></div><div style="display:flex;gap:8px"><div class="skeleton" style="height:12px;width:80px;border-radius:4px"></div><div class="skeleton" style="height:12px;width:60px;border-radius:4px"></div></div><div class="skeleton" style="height:40px;width:100%;border-radius:8px"></div><div class="skeleton" style="height:40px;width:100%;border-radius:8px"></div></div></div></div></body></html>
    </div>
  </foreignObject>
