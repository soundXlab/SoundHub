<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — Connected Accounts</title><link rel="stylesheet" href="design-system/shared.css"></head><body><div class="app-layout"><aside class="sidebar"><div class="sidebar-logo"><div class="logo-icon">S</div><div class="logo-text">SoundHub</div></div><nav class="sidebar-nav"><div class="sidebar-section-label">Main</div><a class="sidebar-item" href="#"><span class="icon">📊</span> Dashboard</a><div class="sidebar-section-label">Account</div><a class="sidebar-item active" href="#"><span class="icon">⚙️</span> Settings</a></nav><div class="sidebar-footer"><a class="sidebar-item" href="#"><span class="icon">❓</span> Help</a></div></aside><div class="main-content"><header class="topbar"><div style="font-size:14px;font-weight:600">Settings</div><div class="topbar-right"><div class="topbar-avatar">P</div></div></header><div class="page"><h1 class="page-title" style="margin-bottom:24px">Connected Accounts</h1><div style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:16px;padding:20px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg)"><span style="font-size:28px">🦊</span><div style="flex:1"><div style="font-size:14px;font-weight:600">MetaMask</div><div style="font-size:12px;color:var(--text-muted)">0x1234...5678</div></div><span class="badge badge-success">Connected</span><button class="btn btn-ghost btn-sm" style="color:var(--color-error)">Disconnect</button></div><div style="display:flex;align-items:center;gap:16px;padding:20px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg)"><span style="font-size:28px">🔗</span><div style="flex:1"><div style="font-size:14px;font-weight:600">Discord</div><div style="font-size:12px;color:var(--text-muted)">Producer#1234</div></div><span class="badge badge-success">Connected</span><button class="btn btn-ghost btn-sm" style="color:var(--color-error)">Disconnect</button></div><div style="display:flex;align-items:center;gap:16px;padding:20px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg)"><span style="font-size:28px">🌐</span><div style="flex:1"><div style="font-size:14px;font-weight:600">Google</div><div style="font-size:12px;color:var(--text-muted)">Not connected</div></div><button class="btn btn-outline btn-sm">Connect</button></div><div style="display:flex;align-items:center;gap:16px;padding:20px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg)"><span style="font-size:28px">🐙</span><div style="flex:1"><div style="font-size:14px;font-weight:600">GitHub</div><div style="font-size:12px;color:var(--text-muted)">Not connected</div></div><button class="btn btn-outline btn-sm">Connect</button></div></div></div></div></div></body></html>
