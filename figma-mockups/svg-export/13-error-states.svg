<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 1588" 
     width="1440" 
     height="1588">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>SoundHub — Error States</title>
  <link rel="stylesheet" href="design-system/shared.css">
  <style>
    body { background: var(--bg-primary); }
    .mockup-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
      padding: 40px;
      max-width: 1440px;
      margin: 0 auto;
    }
    .mockup-frame {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      overflow: hidden;
    }
    .mockup-label {
      padding: 12px 16px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-default);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .error-page {
      height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
    }
    .error-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 16px;
    }
    .error-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .error-desc {
      font-size: 13px;
      color: var(--text-secondary);
      max-width: 300px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-elevated);
      padding: 4px 8px;
      border-radius: 4px;
      margin-top: 8px;
    }
    h1.page-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-primary);
      text-align: center;
      padding: 40px 0 0;
      letter-spacing: -0.5px;
    }
    p.page-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      padding: 8px 0 24px;
    }
    /* Toast styles */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      font-size: 13px;
      min-width: 320px;
    }
    .toast.success { border-left: 3px solid var(--color-success); }
    .toast.error { border-left: 3px solid var(--color-error); }
    .toast.warning { border-left: 3px solid var(--color-warning); }
    .toast.info { border-left: 3px solid var(--color-info); }
    .toast-icon { font-size: 16px; flex-shrink: 0; }
    .toast-text { flex: 1; color: var(--text-primary); }
    .toast-close { color: var(--text-muted); cursor: pointer; font-size: 14px; }
    .modal-dialog {
      position: relative;
      background: var(--bg-primary);
      border-radius: var(--radius-xl);
      padding: 32px;
      text-align: center;
      border: 1px solid var(--border-default);
    }
  </style>
</head>
<body>
  <h1 class="page-title">Error &amp; Toast States</h1>
  <p class="page-subtitle">How errors and feedback appear throughout the app</p>

  <div class="mockup-grid">
    <!-- Upload Failed -->
    <div class="mockup-frame">
      <div class="mockup-label">Upload Failed</div>
      <div class="error-page">
        <div class="error-icon" style="background:rgba(239,68,68,0.12)">❌</div>
        <div class="error-title">Upload failed</div>
        <div class="error-desc">Failed to upload file. Check your connection and try again.</div>
        <button class="btn btn-primary">Retry upload</button>
        <button class="btn btn-ghost" style="margin-top:8px">Choose different file</button>
      </div>
    </div>

    <!-- Parse Error -->
    <div class="mockup-frame">
      <div class="mockup-label">Parse Error</div>
      <div class="error-page">
        <div class="error-icon" style="background:rgba(234,179,8,0.12)">⚠️</div>
        <div class="error-title">Could not parse DAW file</div>
        <div class="error-desc">The .als file appears to be corrupted or uses an unsupported version.</div>
        <button class="btn btn-primary">Try another file</button>
        <div class="error-code">ERR_PARSE_v12_UNSUPPORTED</div>
      </div>
    </div>

    <!-- 404 -->
    <div class="mockup-frame">
      <div class="mockup-label">404 — Not Found</div>
      <div class="error-page">
        <div class="error-icon" style="background:rgba(139,92,246,0.12)">🔍</div>
        <div class="error-title">Project not found</div>
        <div class="error-desc">This project may have been deleted or you don't have access.</div>
        <button class="btn btn-primary">Go to Dashboard</button>
      </div>
    </div>

    <!-- Network Error -->
    <div class="mockup-frame">
      <div class="mockup-label">Network Error</div>
      <div class="error-page">
        <div class="error-icon" style="background:rgba(59,130,246,0.12)">📡</div>
        <div class="error-title">Connection lost</div>
        <div class="error-desc">You're offline. Changes will sync automatically when you're back online.</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
          <div style="width:8px;height:8px;border-radius:50%;background:var(--color-warning);animation:pulse 1.5s infinite"></div>
          <span style="font-size:12px;color:var(--text-muted)">Reconnecting...</span>
        </div>
      </div>
    </div>

    <!-- Permission Denied -->
    <div class="mockup-frame">
      <div class="mockup-label">Permission Denied</div>
      <div class="error-page">
        <div class="error-icon" style="background:rgba(239,68,68,0.12)">🔒</div>
        <div class="error-title">Access denied</div>
        <div class="error-desc">You don't have permission to view this project. Ask the owner for access.</div>
        <button class="btn btn-primary">Request access</button>
      </div>
    </div>

    <!-- Payment Failed -->
    <div class="mockup-frame">
      <div class="mockup-label">Payment Failed</div>
      <div class="error-page">
        <div class="error-icon" style="background:rgba(239,68,68,0.12)">💳</div>
        <div class="error-title">Payment failed</div>
        <div class="error-desc">Your card was declined. Please update your payment method.</div>
        <button class="btn btn-primary">Update card</button>
        <div class="error-code">CARD_DECLINED_402</div>
      </div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div style="padding:40px;max-width:1440px;margin:0 auto">
    <h2 style="font-size:18px;font-weight:700;color:var(--text-primary);margin-bottom:16px">Toast Notifications</h2>
  </div>
  <div style="display:flex;gap:16px;padding:0 40px 40px;flex-wrap:wrap;max-width:1440px;margin:0 auto">
    <div class="toast success">
      <span class="toast-icon">✅</span>
      <span class="toast-text">Version v14 uploaded successfully</span>
      <span class="toast-close">×</span>
    </div>
    <div class="toast error">
      <span class="toast-icon">❌</span>
      <span class="toast-text">Failed to save changes. Please try again.</span>
      <span class="toast-close">×</span>
    </div>
    <div class="toast warning">
      <span class="toast-icon">⚠️</span>
      <span class="toast-text">Your storage is 90% full. Upgrade for more space.</span>
      <span class="toast-close">×</span>
    </div>
    <div class="toast info">
      <span class="toast-icon">ℹ️</span>
      <span class="toast-text">Processing complete. Your project is ready.</span>
      <span class="toast-close">×</span>
    </div>
  </div>

  <!-- Confirmation Dialog -->
  <div style="padding:0 40px 40px;max-width:1440px;margin:0 auto">
    <h2 style="font-size:18px;font-weight:700;color:var(--text-primary);margin-bottom:16px">Confirmation Dialog</h2>
    <div style="background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-xl);padding:32px;max-width:400px;text-align:center">
      <div style="font-size:32px;margin-bottom:12px">🗑️</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:8px">Delete project?</div>
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:20px">This action cannot be undone. All versions, comments, and files will be permanently deleted.</div>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="btn btn-secondary">Cancel</button>
        <button class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>


</body></html>
    </div>
  </foreignObject>
</svg>