<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>SoundHub — Create Review</title>
  <link rel="stylesheet" href="design-system/shared.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-primary); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: var(--radius-xl); width: 560px; max-height: 90vh; overflow-y: auto; }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border-default); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 16px; font-weight: 700; }
    .modal-close { width: 28px; height: 28px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); font-size: 16px; }
    .modal-close:hover { background: var(--bg-hover); color: var(--text-primary); }
    .modal-body { padding: 24px; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border-default); display: flex; justify-content: flex-end; gap: 8px; }
    .version-option {
      padding: 12px; border: 1px solid var(--border-default); border-radius: var(--radius-md);
      margin-bottom: 8px; cursor: pointer; transition: all 0.15s;
    }
    .version-option:hover { border-color: var(--border-hover); }
    .version-option.active { border-color: var(--brand-primary); background: rgba(139,92,246,0.08); }
    .version-name { font-size: 13px; font-weight: 600; }
    .version-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .reviewer-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; background: var(--bg-surface); border: 1px solid var(--border-default);
      border-radius: 20px; font-size: 12px; margin: 4px 4px 4px 0;
    }
    .reviewer-chip .remove { cursor: pointer; opacity: 0.6; }
    .reviewer-chip .remove:hover { opacity: 1; }
    .add-reviewer {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 12px; border: 1px dashed var(--border-default);
      border-radius: 20px; font-size: 12px; color: var(--text-muted);
      cursor: pointer; margin: 4px 0;
    }
    .add-reviewer:hover { border-color: var(--brand-primary); color: var(--brand-primary); }
  </style>
</head>
<body>
  <div class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">💬 Create Review Session</span>
        <div class="modal-close">×</div>
      </div>
      <div class="modal-body">
        <div style="display:flex;flex-direction:column;gap:20px">
          <!-- Session Name -->
          <div class="form-group">
            <label class="form-label">Session Name</label>
            <input class="form-input" placeholder="e.g. Master Review — Round 2" value="Neon Warehouse — Final Mix">
          </div>

          <!-- Select Version -->
          <div class="form-group">
            <label class="form-label">Select Version</label>
            <div class="version-option active">
              <div class="version-name">v13 — Final Mix (latest)</div>
              <div class="version-meta">Uploaded 2h ago · 142 MB · Ableton 12</div>
            </div>
            <div class="version-option">
              <div class="version-name">v12 — Pre-master</div>
              <div class="version-meta">Uploaded 1d ago · 138 MB · Ableton 12</div>
            </div>
            <div class="version-option">
              <div class="version-name">v11 — Rough Mix</div>
              <div class="version-meta">Uploaded 3d ago · 135 MB · Ableton 12</div>
            </div>
          </div>

          <!-- Reviewers -->
          <div class="form-group">
            <label class="form-label">Invite Reviewers</label>
            <div>
              <span class="reviewer-chip"><span style="width:18px;height:18px;border-radius:50%;background:#22c55e;display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:700">R</span> @remixer <span class="remove">×</span></span>
              <span class="reviewer-chip"><span style="width:18px;height:18px;border-radius:50%;background:#3b82f6;display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:700">M</span> @mastering_guru <span class="remove">×</span></span>
              <span class="add-reviewer">+ Add reviewer</span>
            </div>
          </div>

          <!-- Rounds -->
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Max Rounds</label>
              <select class="form-select" style="width:100%"><option>2 rounds</option><option selected>3 rounds</option><option>5 rounds</option><option>Unlimited</option></select>
            </div>
            <div class="form-group">
              <label class="form-label">Deadline</label>
              <input class="form-input" type="date" value="2026-09-15">
            </div>
          </div>

          <!-- Options -->
          <div class="form-group">
            <label class="form-label">Options</label>
            <div style="display:flex;flex-direction:column;gap:8px;font-size:13px">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text-secondary)">
                <input type="checkbox" checked> Enable timestamped comments
              </label>
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text-secondary)">
                <input type="checkbox" checked> Notify reviewers by email
              </label>
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text-secondary)">
                <input type="checkbox"> Allow anonymous feedback
              </label>
            </div>
          </div>

          <!-- Message -->
          <div class="form-group">
            <label class="form-label">Message (optional)</label>
            <textarea class="form-input" rows="3" placeholder="Any notes for reviewers..." style="resize:vertical">Please focus on the low-end balance and stereo width. Let me know if the vocal sits well in the mix.</textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary">Save as Draft</button>
        <button class="btn btn-primary">🚀 Create & Invite</button>
      </div>
    </div>
  </div>
</body>
</html>
