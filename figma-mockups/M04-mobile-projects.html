v class="m-project"><div style="display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;border-radius:var(--radius-sm);background:rgba(234,179,8,0.12);display:flex;align-items:center;justify-content:center;font-size:16px">🎵</div><div style="flex:1"><div style="font-size:13px;font-weight:600">Midnight Run</div><div style="font-size:10px;color:var(--text-muted);font-family:var(--font-mono)">v7 · 140 BPM</div></div><span class="badge badge-warning" style="font-size:9px">Review</span></div></div><div class="m-project"><div style="display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;border-radius:var(--radius-sm);background:rgba(59,130,246,0.12);display:flex;align-items:center;justify-content:center;font-size:16px">🎵</div><div style="flex:1"><div style="font-size:13px;font-weight:600">Crystal Echo</div><div style="font-size:10px;color:var(--text-muted);font-family:var(--font-mono)">v1 · 90 BPM</div></div><span class="badge badge-muted" style="font-size:9px">Draft</span></div></div></div><div class="mobile-nav"><div class="mobile-nav-item"><span class="nav-icon">📊</span>Home</div><div class="mobile-nav-item active"><span class="nav-icon">📁</span>Projects</div><div class="mobile-nav-item"><span class="nav-icon">🛒</span>Shop</div><div class="mobile-nav-item"><span class="nav-icon">💬</span>Reviews</div><div class="mobile-nav-item"><span class="nav-icon">👤</span>Profile</div></div></div></body></html>
