<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>SoundHub — New Project</title><link rel="stylesheet" href="design-system/shared.css"><style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg-primary)}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100}.modal{background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-xl);width:520px;max-height:90vh;overflow-y:auto}.modal-header{padding:20px 24px;border-bottom:1px solid var(--border-default);display:flex;align-items:center;justify-content:space-between}.modal-title{font-size:16px;font-weight:700}.modal-close{width:28px;height:28px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);font-size:16px}.modal-close:hover{background:var(--bg-hover);color:var(--text-primary)}.modal-body{padding:24px}.modal-footer{padding:16px 24px;border-top:1px solid var(--border-default);display:flex;justify-content:flex-end;gap:8px}.daw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.daw-option{padding:12px;border:1px solid var(--border-default);border-radius:var(--radius-md);text-align:center;cursor:pointer;transition:all 0.15s}.daw-option:hover{border-color:var(--border-hover)}.daw-option.active{border-color:var(--brand-primary);background:rgba(139,92,246,0.08)}.daw-option .icon{font-size:24px;margin-bottom:4px}.daw-option .name{font-size:11px;font-weight:600;color:var(--text-secondary)}</style></head><body><div class="modal-overlay"><div class="modal"><div class="modal-header"><span class="modal-title">Create New Project</span><div class="modal-close">×</div></div><div class="modal-body"><div style="display:flex;flex-direction:column;gap:16px"><div class="form-group"><label class="form-label">Project Name</label><input class="form-input" placeholder="My New Track"></div><div class="form-group"><label class="form-label">DAW</label><div class="daw-grid"><div class="daw-option active"><div class="icon">🎵</div><div class="name">Ableton Live</div></div><div class="daw-option"><div class="icon">🎹</div><div class="name">FL Studio</div></div><div class="daw-option"><div class="icon">🎸</div><div class="name">REAPER</div></div><div class="daw-option"><div class="icon">🎛️</div><div class="name">Logic Pro</div></div></div></div><div class="grid-2"><div class="form-group"><label class="form-label">Genre</label><select class="form-select" style="width:100%"><option>Select genre...</option><option>Electronic</option><option>Hip-Hop</option><option>Pop</option><option>Rock</option><option>Jazz</option></select></div><div class="form-group"><label class="form-label">BPM</label><input class="form-input" placeholder="120"></div></div><div class="form-group"><label class="form-label">Visibility</label><div style="display:flex;gap:8px"><div style="flex:1;padding:10px;border:1px solid var(--brand-primary);background:rgba(139,92,246,0.08);border-radius:var(--radius-sm);text-align:center;font-size:12px;font-weight:600;color:var(--brand-primary);cursor:pointer">🔒 Private</div><div style="flex:1;padding:10px;border:1px solid var(--border-default);border-radius:var(--radius-sm);text-align:center;font-size:12px;font-weight:500;color:var(--text-muted);cursor:pointer">🌐 Public</div><div style="flex:1;padding:10px;border:1px solid var(--border-default);border-radius:var(--radius-sm);text-align:center;font-size:12px;font-weight:500;color:var(--text-muted);cursor:pointer">🔗 Unlisted</div></div></div></div></div><div class="modal-footer"><button class="btn btn-secondary">Cancel</button><button class="btn btn-primary">Create Project</button></div></div></div></body></html>
