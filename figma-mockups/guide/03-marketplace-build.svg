<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
  <rect width="1400" height="1000" fill="#0A0A0B"/>
  
  <!-- Title -->
  <text x="40" y="40" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Marketplace — Build Guide for Penpot</text>
  <text x="40" y="65" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Layout: TopBar + Sidebar + Filters + 3-column grid</text>
  
  <!-- TopBar (same as Dashboard) -->
  <rect x="40" y="80" width="1320" height="60" rx="0" fill="#111113"/>
  <text x="60" y="115" font-family="Inter, sans-serif" font-size="18" font-weight="900" fill="#8B5CF6">⬡ SoundHub</text>
  <rect x="200" y="92" width="400" height="36" rx="8" fill="#0A0A0B" stroke="#27272A" stroke-width="1"/>
  <text x="220" y="115" font-family="Inter, sans-serif" font-size="13" fill="#52525B">🔍 Search marketplace...</text>
  
  <!-- Sidebar (same as Dashboard) -->
  <rect x="40" y="140" width="260" height="820" fill="#111113"/>
  <text x="60" y="180" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#52525B" letter-spacing="1">NAVIGATION</text>
  
  <rect x="50" y="295" width="240" height="40" rx="8" fill="#8B5CF6" opacity="0.15"/>
  <text x="70" y="320" font-family="Inter, sans-serif" font-size="13" fill="#8B5CF6">🛒 Marketplace</text>
  
  <!-- Filters Panel -->
  <text x="60" y="380" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#52525B" letter-spacing="1">FILTERS</text>
  
  <!-- DAW Filter -->
  <text x="60" y="410" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#A1A1AA">DAW</text>
  <rect x="50" y="420" width="100" height="32" rx="6" fill="#8B5CF6" opacity="0.15"/>
  <text x="100" y="441" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#8B5CF6">Ableton</text>
  <rect x="160" y="420" width="80" height="32" rx="6" fill="#0A0A0B" stroke="#27272A" stroke-width="1"/>
  <text x="200" y="441" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#71717A">FL Studio</text>
  
  <!-- Genre Filter -->
  <text x="60" y="480" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#A1A1AA">Genre</text>
  <rect x="50" y="490" width="70" height="32" rx="6" fill="#8B5CF6" opacity="0.15"/>
  <text x="85" y="511" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#8B5CF6">All</text>
  <rect x="130" y="490" width="70" height="32" rx="6" fill="#0A0A0B" stroke="#27272A" stroke-width="1"/>
  <text x="165" y="511" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#71717A">Electronic</text>
  <rect x="210" y="490" width="60" height="32" rx="6" fill="#0A0A0B" stroke="#27272A" stroke-width="1"/>
  <text x="240" y="511" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#71717A">Hip-Hop</text>
  
  <!-- Price Filter -->
  <text x="60" y="550" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#A1A1AA">Price</text>
  <rect x="50" y="560" width="60" height="32" rx="6" fill="#22C55E" opacity="0.15"/>
  <text x="80" y="581" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#22C55E">Free</text>
  <rect x="120" y="560" width="60" height="32" rx="6" fill="#0A0A0B" stroke="#27272A" stroke-width="1"/>
  <text x="150" y="581" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#71717A">Paid</text>
  <rect x="190" y="560" width="80" height="32" rx="6" fill="#0A0A0B" stroke="#27272A" stroke-width="1"/>
  <text x="230" y="581" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#71717A">Premium</text>
  
