<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <rect width="1400" height="900" fill="#0A0A0B"/>
  
  <!-- Title -->
  <text x="40" y="40" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Login Page — Build Guide for Penpot</text>
  <text x="40" y="65" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Точные размеры, цвета и позиции для создания в Penpot</text>
  
  <!-- Page Canvas -->
  <rect x="40" y="80" width="500" height="780" rx="12" fill="#111113" stroke="#27272A" stroke-width="1"/>
  <text x="290" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#71717A">— CANVAS (500×780) —</text>
  
  <!-- Background -->
  <rect x="40" y="80" width="500" height="780" rx="12" fill="#0A0A0B"/>
  
  <!-- Logo -->
  <text x="290" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="900" fill="#8B5CF6">⬡ SoundHub</text>
  <text x="290" y="205" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Professional Sound Marketplace</text>
  
  <!-- Form Card -->
  <rect x="80" y="240" width="420" height="380" rx="16" fill="#111113" stroke="#27272A" stroke-width="1"/>
  
  <!-- Tabs -->
  <rect x="80" y="240" width="210" height="48" rx="16" fill="#8B5CF6"/>
  <text x="185" y="270" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Sign In</text>
  <rect x="290" y="240" width="210" height="48" rx="16" fill="transparent"/>
  <text x="395" y="270" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#71717A">Register</text>
  
  <!-- Username Field -->
  <text x="100" y="320" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#A1A1AA">Username</text>
  <rect x="100" y="330" width="380" height="48" rx="12" fill="#0A0A0B" stroke="#27272A" stroke-width="1"/>
  <text x="120" y="360" font-family="Inter, sans-serif" font-size="14" fill="#52525B">demo</text>
  
  <!-- Password Field -->
  <text x="100" y="400" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#A1A1AA">Password</text>
  <rect x="100" y="410" width="380" height="48" rx="12" fill="#0A0A0B" stroke="#27272A" stroke-width="1"/>
  <text x="120" y="440" font-family="Inter, sans-serif" font-size="14" fill="#52525B">••••••••</text>
  <text x="460" y="440" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#8B5CF6">Show</text>
  
  <!-- Sign In Button -->
  <rect x="100" y="480" width="380" height="48" rx="12" fill="#8B5CF6"/>
  <text x="290" y="510" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Sign In</text>
  
  <!-- Divider -->
  <line x1="100" y1="550" x2="250" y2="550" stroke="#27272A" stroke-width="1"/>
  <text x="290" y="555" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#52525B">or</text>
  <line x1="330" y1="550" x2="480" y2="550" stroke="#27272A" stroke-width="1"/>
  
  <!-- MetaMask Button -->
  <rect x="100" y="570" width="380" height="48" rx="12" fill="#0A0A0B" stroke="#F6851B" stroke-width="2"/>
  <text x="290" y="600" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#F6851B">🦊 Sign in with wallet</text>
  
  <!-- Footer -->
  <text x="290" y="670" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#52525B">Need an account? Register</text>
  
  <!-- Specs Panel -->
  <rect x="580" y="80" width="780" height="780" rx="12" fill="#111113" stroke="#27272A" stroke-width="1"/>
  <text x="600" y="110" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">📐 Specifications</text>
  
  <!-- Colors -->
  <text x="600" y="150" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#52525B" letter-spacing="1">COLORS</text>
  
  <rect x="600" y="165" width="24" height="24" rx="4" fill="#0A0A0B" stroke="#27272A" stroke-width="1"/>
  <text x="634" y="182" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">Background: #0A0A0B</text>
  
  <rect x="600" y="200" width="24" height="24" rx="4" fill="#111113" stroke="#27272A" stroke-width="1"/>
  <text x="634" y="217" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">Card: #111113</text>
  
  <rect x="600" y="235" width="24" height="24" rx="4" fill="#8B5CF6"/>
  <text x="634" y="252" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">Primary: #8B5CF6</text>
  
  <rect x="600" y="270" width="24" height="24" rx="4" fill="#27272A"/>
  <text x="634" y="287" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">Border: #27272A</text>
  
  <rect x="600" y="305" width="24" height="24" rx="4" fill="#F6851B"/>
  <text x="634" y="322" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">MetaMask: #F6851B</text>
  
  <!-- Dimensions -->
  <text x="600" y="370" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#52525B" letter-spacing="1">DIMENSIONS</text>
  
  <text x="600" y="395" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">Canvas: 500 × 780 px</text>
  <text x="600" y="415" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">Form Card: 420 × 380 px</text>
  <text x="600" y="435" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">Input Fields: 380 × 48 px</text>
  <text x="600" y="455" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">Buttons: 380 × 48 px</text>
  <text x="600" y="475" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">Border Radius: 12px (inputs), 16px (card)</text>
  <text x="600" y="495" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1AA">Padding: 20px (card internal)</text>
  
  <!-- Typography -->
  <text x="600" y="540" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#52525B" letter-spacing="1">TYPOGRAPHY</text>
  
  <text x="600" y="565" font-family="Inter, sans-serif" font-size="28" font-weight="900" fill="#8B5CF6">Logo: 28px Bold</text>
  <text x="600" y="590" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Button: 14px Semibold</text>
  <text x="600" y="610" font-family="Inter, sans-serif" font-size="14" fill="#A1A1AA">Input: 14px Regular</text>
  <text x="600" y="630" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Label: 12px Semibold</text>
  <text x="600" y="650" font-family="Inter, sans-serif" font-size="12" fill="#52525B">Hint: 12px Regular</text>
  
  <!-- Steps -->
  <text x="600" y="700" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#52525B" letter-spacing="1">STEPS IN PENPOT</text>
  
  <text x="600" y="725" font-family="Inter, sans-serif" font-size="12" fill="#A1A1AA">1. Rectangle 500×780 → Fill #0A0A0B</text>
  <text x="600" y="745" font-family="Inter, sans-serif" font-size="12" fill="#A1A1AA">2. Rectangle 420×380 → Fill #111113, Radius 16</text>
  <text x="600" y="765" font-family="Inter, sans-serif" font-size="12" fill="#A1A1AA">3. Tabs: Rect 210×48 → Fill #8B5CF6</text>
  <text x="600" y="785" font-family="Inter, sans-serif" font-size="12" fill="#A1A1AA">4. Inputs: Rect 380×48 → Fill #0A0A0B, Stroke #27272A</text>
</svg>