# Cloud Build configuration for SoundHub
steps:
# Build
- name: 'gcr.io/cloud-builders/docker'
  id: 'Build'
  args:
    - 'build'
    - '-t'
    - 'us-docker.pkg.dev/$PROJECT_ID/docker/soundhub'
    - '.'
  waitFor: ['-']

# Push with Artifact Registry auth using gcloud CLI
- name: 'gcr.io/cloud-builders/docker'
  id: 'Push'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      # Set up Docker authentication with gcloud
      gcloud auth configure-docker us-docker.pkg.dev --quiet
      docker push us-docker.pkg.dev/$PROJECT_ID/docker/soundhub
  waitFor: ['Build']

# Deploy
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Deploy'
  entrypoint: 'gcloud'
  args:
    - 'run'
    - 'deploy'
    - 'soundhub'
    - '--image'
    - 'us-docker.pkg.dev/$PROJECT_ID/docker/soundhub'
    - '--platform'
    - 'managed'
    - '--region'
    - 'us-central1'
    - '--allow-unauthenticated'
    - '--service-account'
    - '634858473264-compute@developer.gserviceaccount.com'
    - '--set-env-vars'
    - 'SOUNDHUB_STORAGE_PROVIDER=gcs,SOUNDHUB_GCS_BUCKET=soundhub-assets-$PROJECT_ID,SOUNDHUB_ENV=production,SOUNDHUB_CORS_ORIGINS=*'
  waitFor: ['Push']

images:
- 'us-docker.pkg.dev/$PROJECT_ID/docker/soundhub'
